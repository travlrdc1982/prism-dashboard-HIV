[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-platform"
version = "0.1.0"
description = "PRISM 16-segment analytics platform: composites, activation, DQ, two-stage weighting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyreadstat>=1.2",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "openpyxl>=3.1"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Topline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* PRISM TOPLINE DASHBOARD — V2 */
:root {
  --ink: #0f172a; --ink-soft: #475569; --ink-mute: #94a3b8;
  --bg: #fff; --bg-alt: #f8fafc; --bg-panel: #f1f5f9;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --gop: #b91c1c; --gop-band: #fee2e2;
  --dem: #1d4ed8; --dem-band: #dbeafe;
  --total: #334155; --total-band: #e2e8f0;
  --above-1: #ecfeff; --above-2: #cffafe; --above-3: #a5f3fc; --above-4: #67e8f9;
  --below-1: #fff7ed; --below-2: #fed7aa; --below-3: #fdba74; --below-4: #fb923c;
  --delta-pos: #1d4ed8; --delta-neg: #c2410c;
  --survey-bg: #f5efe5; --survey-card: #ffffff; --survey-stem: #2a2a2a;
  --survey-circle: #cfcfcf;
  --survey-anchor-neg: #b86a5e; --survey-anchor-pos: #6b9c6e;
  --survey-progress: #6b9c6e;
  /* 7-pt diverging palette for selected dot — red (disagree) → gray (neutral) → green (agree) */
  --dot-1: #b94d3d;  /* dark red */
  --dot-2: #c97a6f;  /* medium red */
  --dot-3: #dfa8a0;  /* light red */
  --dot-4: #b8b0a5;  /* gray (neutral) */
  --dot-5: #b9d4ba;  /* light green */
  --dot-6: #7eaa80;  /* medium green */
  --dot-7: #4d8051;  /* dark green */
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1.4; color: var(--ink); background: var(--bg);
  font-feature-settings: "tnum" 1, "kern" 1;
}

/* ── MAIN HEADER BAR (larger, more prominent) ── */
.topnav { position: sticky; top: 0; z-index: 100; background: var(--ink); color: white;
  display: flex; align-items: center; padding: 16px 28px;
  border-bottom: 3px solid var(--gop); box-shadow: 0 1px 6px rgba(0,0,0,0.15); }
.topnav .brand { font-weight: 800; font-size: 22px; letter-spacing: -0.3px; padding-right: 20px; }
.topnav .brand .prism-logo { color: white; }
.topnav .brand .study { color: #cbd5e1; font-weight: 500; font-size: 17px; margin-left: 14px; padding-left: 14px; border-left: 1px solid #475569; }
.topnav .nav-spacer { flex: 1; }
.topnav .tools { display: flex; gap: 8px; }
.topnav .tools button { background: transparent; color: #cbd5e1; border: 1px solid #475569;
  padding: 6px 14px; font-size: 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
.topnav .tools button:hover { background: #1e293b; color: white; }

/* ── SECONDARY NAV ROW: horizontal module chips ── */
.modnav { position: sticky; top: 60px; z-index: 99; background: var(--bg-panel); border-bottom: 1px solid var(--border-strong);
  display: flex; gap: 0; padding: 0 20px; overflow-x: auto; }
.modnav-chip { display: flex; flex-direction: column; gap: 2px;
  padding: 10px 16px; cursor: pointer; text-decoration: none;
  border-right: 1px solid var(--border); white-space: nowrap;
  background: transparent; transition: background 0.12s ease; }
.modnav-chip:hover { background: white; }
.modnav-chip.disabled { opacity: 0.4; cursor: not-allowed; }
.modnav-chip .chip-num { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; color: var(--ink-mute); text-transform: uppercase; }
.modnav-chip .chip-title { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.modnav-chip.disabled .chip-title { color: var(--ink-mute); font-style: italic; }
/* ── TITLE PAGE (first section) ── */
.title-page { padding: 36px 24px 28px; background: var(--bg-alt); border-bottom: 1px solid var(--border); }
.title-page-header { margin: 0 0 28px; }
.title-page-header .study-title { font-size: 36px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 6px; color: var(--ink); }
.title-page-header .study-subtitle { font-size: 14px; color: var(--ink-soft); margin: 0; }

/* Title page block uses slightly wider codebook column for metadata */
.title-page-block { grid-template-columns: 260px 280px max-content !important; }

.title-pane-codebook .cb-row { display: grid; grid-template-columns: 90px 1fr; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid #f0eee9; align-items: start; }
.title-pane-codebook .cb-row:last-child { border-bottom: none; }
.title-pane-codebook .cb-key { font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
  color: var(--ink-soft); text-transform: uppercase; line-height: 1.4; }
.title-pane-codebook .cb-val { font-size: 12.5px; color: var(--ink); }
.title-pane-codebook .cb-val.cb-mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }

.title-pane-survey-intro { font-family: 'Fraunces', Georgia, serif; font-size: 13px;
  color: var(--survey-stem); line-height: 1.55; }
.title-pane-survey-intro p { margin: 0 0 10px; }
.title-pane-survey-intro .intro-section-label { display: block; font-family: 'Inter', sans-serif;
  font-size: 9px; font-weight: 700; letter-spacing: 0.8px; color: #9a8e7c;
  text-transform: uppercase; margin-bottom: 8px; }

/* Sample composition table in banner pane — reuses .sample-table styling */
.title-pane-banner table { width: 100%; }
.title-pane-banner .sample-table-frame { font-size: 9.5px; font-style: italic; color: var(--ink-soft);
  padding: 6px 0 0; text-align: right; }

.preliminary-notice { padding: 12px 24px; background: #fef3c7; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); color: #78350f; font-size: 12.5px; }
.preliminary-notice strong { color: #92400e; }
.preliminary-notice:has(strong:first-child:not(:empty)) {
  /* Default amber stays for "Preliminary"; we override below for production */
}
/* When the notice leads with "Production data.", swap to green */
.preliminary-notice.production-data { background: #ecfdf5; color: #065f46; border-top-color: #a7f3d0; border-bottom-color: #a7f3d0; }
.preliminary-notice.production-data strong { color: #047857; }

section { padding: 28px 24px; border-bottom: 1px solid var(--border); }

.landing { padding: 40px 24px; background: linear-gradient(180deg, var(--bg-alt) 0%, var(--bg) 100%); }
.landing-header { max-width: 1200px; margin: 0 auto 28px; }
.landing-header .study-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 4px; }
.landing-header .study-subtitle { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }
.landing-header .meta { display: flex; gap: 28px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); padding-top: 12px; border-top: 1px solid var(--border); }
.landing-header .meta div { display: flex; flex-direction: column; gap: 2px; }
.landing-header .meta label { color: var(--ink-mute); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
.landing-header .meta span { color: var(--ink); font-weight: 600; }
.landing-grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.landing-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px 22px; }
.landing-card h3 { margin: 0 0 14px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); }
.sample-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sample-table th, .sample-table td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
.sample-table th { font-weight: 600; color: var(--ink-soft); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
.sample-table td.code { font-weight: 700; width: 40px; text-align: left; }
.sample-table td.name { color: var(--ink-soft); text-align: left; }
.sample-table tr.party-head td { background: var(--bg-panel); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 8px 4px; border-bottom: 2px solid var(--border-strong); text-align: left; }
.sample-table tr.party-head.gop td { color: var(--gop); border-left: 3px solid var(--gop); }
.sample-table tr.party-head.dem td { color: var(--dem); border-left: 3px solid var(--dem); }
.sample-table tr.total td { font-weight: 700; background: var(--total-band); border-top: 2px solid var(--total); text-align: right; }
.sample-table tr.total td:first-child { text-align: left; }
.sample-table .bar { display: inline-block; height: 8px; background: var(--ink-soft); vertical-align: middle; margin-right: 6px; border-radius: 1px; }
.sample-table tr.gop .bar { background: var(--gop); opacity: 0.6; }
.sample-table tr.dem .bar { background: var(--dem); opacity: 0.6; }
.nav-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.nav-tile { display: block; padding: 14px 16px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--ink); }
.nav-tile:hover { background: white; border-color: var(--ink-soft); }
.nav-tile.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.nav-tile .tile-num { font-size: 10px; color: var(--ink-mute); font-weight: 700; letter-spacing: 0.5px; }
.nav-tile .tile-title { font-size: 13px; font-weight: 700; margin: 2px 0; }
.nav-tile .tile-desc { font-size: 11px; color: var(--ink-soft); }
.advisory { max-width: 1400px; margin: 24px auto 0; padding: 12px 16px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; font-size: 12px; color: #78350f; }
.advisory strong { color: #92400e; }

.section-bar { background: var(--ink); color: white; padding: 14px 24px;
  font-weight: 700; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase;
  border-bottom: 3px solid var(--gop); }
.section-bar .sb-meta { font-size: 11px; color: #94a3b8; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 12px; }
.section-intro { padding: 14px 24px; background: var(--bg-alt); font-size: 12px; color: var(--ink-soft); border-bottom: 1px solid var(--border); font-style: italic; }
.section-intro strong { color: var(--ink); font-style: normal; }
.roi-wrap { padding: 14px 0 8px 0; background: white; overflow-x: auto; }
.roi-wrap svg { display: block; width: 100%; height: auto; max-width: 100%; }
.roi-empty { padding: 40px; text-align: center; color: var(--ink-soft); font-style: italic; }
.roi-export-bar { padding: 14px 24px; background: #f5f7fb; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.roi-export-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-right: 6px; }
.roi-export-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; background: white;
  border: 1.5px solid var(--ink); color: var(--ink); cursor: pointer; border-radius: 4px;
  font-family: inherit; transition: background 0.15s ease, color 0.15s ease; }
.roi-export-btn:hover { background: var(--ink); color: white; }
.roi-export-btn:active { transform: translateY(1px); }

/* ─── Demographics module styles ─── */
.demos-toggle-bar { display: flex; align-items: center; gap: 10px; padding: 12px 24px;
  background: #f5f7fb; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.demos-toggle-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-right: 4px; }
.demos-toggle-btn { padding: 7px 14px; font-size: 13px; font-weight: 600; background: white;
  border: 1.5px solid var(--ink); color: var(--ink); cursor: pointer; border-radius: 4px;
  font-family: inherit; transition: all 0.15s ease; }
.demos-toggle-btn:hover { background: var(--ink); color: white; }
.demos-toggle-btn.active { background: var(--ink); color: white; }
.demos-toggle-note { font-size: 11.5px; color: var(--ink-soft); font-style: italic; margin-left: 8px; }

.demo-block-wrap { padding: 0; border-bottom: 1px solid var(--border); }
.demo-header { display: flex; justify-content: space-between; align-items: center;
  padding: 10px 24px; background: var(--ink); color: white; }
.demo-header .ih-code { font-family: 'JetBrains Mono', monospace; font-size: 11px;
  font-weight: 700; opacity: 0.85; padding: 3px 8px; background: rgba(255,255,255,0.12);
  border-radius: 3px; margin-right: 12px; letter-spacing: 0.4px; }
.demo-header .ih-title { font-size: 14px; font-weight: 600; }
.demo-header .ih-metric { font-size: 12px; opacity: 0.75; font-style: italic; }

/* Demographics inherits .item-block geometry verbatim — same 240/240/max-content,
   same left-anchored placement. The "brochure rails" principle: survey rail,
   codebook rail, banner rail all line up across every module. */
.demo-block > * { min-width: 0; }
.sp-stem-secondary { font-size: 10px; color: #7c6f5a; font-style: italic; margin-bottom: 8px; }
.demo-stacked { padding: 8px 0; }
.demo-stacked-sep { border-top: 1px dashed #ccc1ac; margin-top: 8px; padding-top: 10px; }
.demo-opt { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 4px 6px; color: #3a3225; }
.demo-opt.radio .demo-radio { width: 12px; height: 12px; border: 1.5px solid #a89882; border-radius: 50%; flex-shrink: 0; background: white; }
.demo-opt.radio.selected .demo-radio { background: #3d6e3a; border-color: #3d6e3a; }
.demo-opt.radio.selected { font-weight: 600; color: #2c2418; }
.demo-button-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.demo-button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 6px; }
.demo-button { padding: 8px 10px; border: 1.5px solid #a89882; border-radius: 999px; font-size: 10px; background: white;
  color: #3a3225; text-align: center; line-height: 1.2; }
.demo-button-grid .demo-button { border-radius: 6px; padding: 8px 4px; }
.demo-button.selected { background: #3d6e3a; color: white; border-color: #3d6e3a; font-weight: 700; }
.demo-dropdown { background: white; border: 1.5px solid #a89882; border-radius: 6px; padding: 8px; margin-top: 6px; max-height: 220px; overflow-y: auto; }
.demo-dropdown-stem { font-size: 10px; color: #5a4d3a; padding: 4px 6px; border: 1px solid #d8cfc0; border-radius: 4px; background: #f5efe0; margin-bottom: 4px; }
.demo-dropdown-opt { font-size: 10px; padding: 3px 6px; color: #5a4d3a; }
.demo-dropdown-opt.selected { background: #3d6e3a; color: white; font-weight: 600; border-radius: 3px; }
.demo-age-row { display: flex; gap: 10px; margin-top: 6px; }
.demo-age-box { width: 48px; height: 48px; background: #d8d2c2; border: 1.5px solid #5a4d3a; border-radius: 4px; }
.demo-numeric-meta { font-size: 10px; color: #5a4d3a; text-align: center; padding-top: 8px; }
.demo-derived-note { font-size: 10px; color: #7c6f5a; font-style: italic; margin: 4px 0 8px; }
.demo-zip-row { display: flex; gap: 6px; margin-top: 6px; }
.demo-zip-box { width: 32px; height: 38px; background: #d8d2c2; border: 1.5px solid #5a4d3a; border-radius: 3px; }
.demo-derived-subtitle { font-size: 10px; color: #7c6f5a; margin-top: 10px; padding: 6px 8px;
  background: rgba(255,255,255,0.5); border: 1px solid #ddd2bd; border-radius: 4px; line-height: 1.4; }

/* Codebook — clean 6-field grid */
.demo-cb { display: flex; flex-direction: column; gap: 4px; padding: 0; }
.demo-cb .cb-row { display: grid; grid-template-columns: 78px 1fr; gap: 8px; padding: 5px 0;
  border-bottom: 1px solid #f0eee9; align-items: start; }
.demo-cb .cb-row:last-child { border-bottom: none; }
.demo-cb .cb-key { font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--ink-soft);
  text-transform: uppercase; padding-top: 1px; }
.demo-cb .cb-val { font-size: 11.5px; color: var(--ink); line-height: 1.4; }
.demo-cb .cb-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.demo-cb .cb-derived { font-style: italic; color: var(--ink-soft); font-size: 11px; }
.demo-cb .cb-weight { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #5a4d3a; }

/* Demographics banner inherits the standard banner-table layout —
   same column widths as Pre/Post and Critics so the segment rails line up. */
.demo-banner { }
.demo-banner table { }
.demo-row { background: white; }
.demo-row:hover { background: var(--bg-alt); }
.demo-row-label { font-size: 12px; padding: 6px 10px 6px 0; color: var(--ink); }
.demo-cell { text-align: center; padding: 8px 4px; border-right: 1px solid #eee; font-size: 13px; font-weight: 500; }
.demo-cell.empty { background: #f8f8f8; }

/* ─── Influencer360 module styles ─── */
.inf-subhead { padding: 12px 24px 6px; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.5px; text-transform: uppercase; background: var(--bg-alt); border-top: 1px solid var(--border); }
.inf-subhead-composites { background: #eef3fb; color: #1d3b6d; border-top: 2px solid #1d3b6d; }
.inf-block-wrap { padding: 0 24px 14px; }
.banner-pane-full { width: 100%; }
.banner-pane-full table { width: 100%; }
.inf-row-label { font-size: 11.5px; padding: 6px 10px 6px 0; line-height: 1.35; color: var(--ink); }
.inf-item-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-soft); margin-right: 4px; }
.inf-tier { display: inline-block; padding: 1px 5px; background: #e8e8e8; color: #555; border-radius: 3px; font-size: 9px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.inf-comp-row { background: #f7faff; }
.inf-comp-row .row-label-cell { background: #f7faff; }
.inf-comp-row .cell-val { font-weight: 700; }
.inf-cat-row .inf-cat-label { padding-left: 16px; color: #555; font-size: 11px; }

.demos-empty { padding: 40px; text-align: center; color: var(--ink-soft); font-style: italic; }

/* Influencer360 — survey-pane styles for the 5 block types */
.inf-checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.inf-checklist-item { display: flex; align-items: flex-start; gap: 8px; font-size: 10.5px; color: #3a3225;
  padding: 5px 6px; background: rgba(255,255,255,0.6); border-radius: 4px; border: 1px solid #e5dcc7; line-height: 1.3; }
.inf-checkbox { width: 12px; height: 12px; border: 1.5px solid #a89882; border-radius: 2px; background: white; flex-shrink: 0; margin-top: 1px; }
.inf-checklist-none { margin-top: 6px; padding: 5px 10px; background: #e5dcc7; border-radius: 4px;
  font-size: 10px; color: #5a4d3a; text-align: center; font-style: italic; }
.inf-buttongrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 6px; }
.inf-buttongrid .demo-button { padding: 10px 4px; border-radius: 6px; font-weight: 600; }
.inf-cardshuffle { margin-top: 6px; }
.inf-cs-card { background: white; border: 1.5px solid #a89882; border-radius: 6px; padding: 10px 8px;
  font-size: 11px; color: #3a3225; min-height: 40px; display: flex; align-items: center; justify-content: center;
  text-align: center; margin-bottom: 8px; box-shadow: 2px 2px 0 #d8cfc0; }
.inf-cs-prompt { font-weight: 600; }
.inf-cs-scale { display: flex; flex-direction: column; gap: 3px; }
.inf-cs-scaleopt { padding: 4px 8px; background: white; border: 1px solid #d8cfc0; border-radius: 4px;
  font-size: 10px; color: #5a4d3a; text-align: center; }
.inf-cs-rotation { margin-top: 8px; font-size: 9.5px; color: #7c6f5a; font-style: italic; text-align: center; }
.inf-composites-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.inf-composite-row { display: flex; gap: 8px; padding: 5px 6px; background: white; border: 1px solid #e5dcc7; border-radius: 4px;
  font-size: 10.5px; color: #3a3225; align-items: center; }
.inf-composite-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  padding: 2px 6px; background: var(--ink); color: white; border-radius: 3px; flex-shrink: 0; }
.inf-composite-label { flex: 1; }

/* Influencer banner row-label refinements */
.inf-item-code-inline { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-soft);
  margin-right: 4px; padding: 1px 5px; background: #f0eee9; border-radius: 3px; }
.inf-tier-inline { display: inline-block; padding: 1px 5px; background: #e8e8e8; color: #555;
  border-radius: 3px; font-size: 9px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-right: 4px; }
.k-false-item { background: rgba(254, 226, 226, 0.4); }
.k-false-item td.rlbl { font-style: italic; color: #7f1d1d; }
.cb-formula { font-size: 10px; line-height: 1.4; word-break: break-word; }
.demo-contact-control { opacity: 0.75; border-style: dashed !important; }
.inf-checklist-item { justify-content: flex-start; }

.legend { padding: 10px 24px; background: white; border-bottom: 1px solid var(--border);
  display: flex; gap: 24px; align-items: center; font-size: 11px; color: var(--ink-soft); flex-wrap: wrap; }
.legend .lg-group { display: flex; align-items: center; gap: 8px; }
.legend .lg-label { font-weight: 600; color: var(--ink); text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; }

}
function sigDots3(level) {
  // 3-tier delta sig: 1 = p<.10 (single hollow), 2 = p<.05 (one dot), 3 = p<.01 (two dots)
  if (!level) return '';
  let dots = '';
  if (level === 1)      dots = '<span class="dot hollow"></span>';
  else if (level === 2) dots = '<span class="dot"></span>';
  else if (level >= 3)  dots = '<span class="dot"></span><span class="dot"></span>';
  return `<span class="sig-marker">${dots}</span>`;
}

function exportROIPng(targetWidth, label) {
  const container = document.getElementById('roi-svg-container');
  if (!container) return;
  const svgEl = container.querySelector('svg');
  if (!svgEl) return;

  // Parse viewBox to get the aspect ratio
  const vb = svgEl.getAttribute('viewBox').split(/\s+/).map(Number);
  const vbW = vb[2], vbH = vb[3];
  const targetHeight = Math.round(targetWidth * vbH / vbW);

  // Clone and serialize the SVG, ensuring fonts and dimensions are explicit
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('width', vbW);
  clone.setAttribute('height', vbH);
  // Force xmlns for the serialized blob
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(clone);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const svgUrl = URL.createObjectURL(svgBlob);

  // Draw into a canvas at target resolution
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');
    // Fill white background (SVG bg might not transfer cleanly)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, targetWidth, targetHeight);
    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
    canvas.toBlob(function(blob) {
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = `PRISM_ROI_${label}_${targetWidth}px.png`;
      a.click();
      URL.revokeObjectURL(dlUrl);
      URL.revokeObjectURL(svgUrl);
    }, 'image/png');
  };
  img.onerror = function() {
    alert('Export failed. The SVG may use externally-loaded fonts that need a moment to load. Try again.');
    URL.revokeObjectURL(svgUrl);
  };
  img.src = svgUrl;
}

function exportROISvg() {
  const container = document.getElementById('roi-svg-container');
  if (!container) return;
  const svgEl = container.querySelector('svg');
  if (!svgEl) return;
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(clone);
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'PRISM_ROI.svg';
  a.click();
  URL.revokeObjectURL(url);
}

// DEMOGRAPHICS module renderer

function renderDemographicsModule(segs) {
  const demos = DATA.demographics || [];
  if (!demos.length) return '<div class="demos-empty">No demographics data computed.</div>';
  // Section-level weighted/unweighted toggle bar
  let html = `
    <div class="demos-toggle-bar">
      <span class="demos-toggle-label">View:</span>
      <button class="demos-toggle-btn active" data-mode="weighted" onclick="setDemoMode('weighted')">Weighted %</button>
      <button class="demos-toggle-btn" data-mode="unweighted" onclick="setDemoMode('unweighted')">Unweighted %</button>
      <span class="demos-toggle-note">Banner cells show the selected view. Hover any cell for n and the other view.</span>
    </div>`;
  html += demos.map(q => renderDemographicQuestion(q, segs)).join('');
  return html;
}

function setDemoMode(mode) {
  document.querySelectorAll('.demos-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.demo-cell').forEach(cell => {
    if (cell.dataset.empty) return;
    const pct = (mode === 'weighted') ? cell.dataset.pctWgt : cell.dataset.pct;
    const valEl = cell.querySelector('.cell-val');
    if (valEl && pct !== undefined) valEl.textContent = `${Number(pct).toFixed(0)}%`;
  });
}

function renderDemographicQuestion(q, segs) {
  // ── binary_set style: multi-item block (Personal Contact) ──
  // Render like the Influencer binary_set blocks: survey pane shows the
  // checklist mockup, codebook describes it as a multi-binary set, banner
  // has one row per item with % Yes + sig markers.
  if (q.style === 'binary_set') {
    return renderDemoBinarySetBlock(q, segs);
  }
  // ── Standard single-variable demographic (existing path) ──
  const surveyPane = renderDemoSurveyPane(q);
  const codebookPane = renderDemoCodebookPane(q);
  const bannerArea = renderDemoBannerArea(q, segs);
  return `<div class="item-block demo-block">${surveyPane}${codebookPane}${bannerArea}</div>`;
}

function renderDemoBinarySetBlock(q, segs) {
  // Survey pane: checklist with the 4 items
  let surveyPane = '<div class="survey-pane demo-pane">';
  surveyPane += `<div class="sp-header"><div class="sp-logo">PRISM</div><div>DEMO.CHECKLIST</div></div>`;
  surveyPane += `<div class="sp-progress"><div></div></div>`;
  surveyPane += `<div class="sp-progress-text">${q.id.toUpperCase()}</div>`;
  surveyPane += '<div class="sp-card">';
  surveyPane += `<div class="sp-stem">${q.wording}</div>`;
  if (q.pane_extra && q.pane_extra.pane_subtitle) {
    surveyPane += `<div class="sp-stem-secondary">${q.pane_extra.pane_subtitle}</div>`;
  }
  surveyPane += '<div class="inf-checklist">';
  (q.items || []).forEach(it => {
    const isControl = it.category === 'control';
    surveyPane += `<div class="inf-checklist-item${isControl ? ' demo-contact-control' : ''}"><span class="inf-checkbox"></span>${it.wording}</div>`;
  });
  surveyPane += '</div>';
  surveyPane += '</div></div>';

  // Codebook pane
  const varList = (q.items || []).map(it => it.var);
  const sourceLine = varList.length <= 4
    ? varList.join(', ')
    : `${varList[0]} … ${varList[varList.length-1]}<br><span class="cb-derived">(${varList.length} variables)</span>`;
  let codebookPane = '<div class="codebook-pane demo-cb">';
  codebookPane += `<div class="cb-row"><div class="cb-key">SOURCE</div><div class="cb-val cb-mono">${sourceLine}</div></div>`;
  codebookPane += `<div class="cb-row"><div class="cb-key">BLOCK</div><div class="cb-val">${q.block_label}</div></div>`;
  codebookPane += `<div class="cb-row"><div class="cb-key">KIND</div><div class="cb-val">Independent binary items (% Yes per item)</div></div>`;
  codebookPane += `<div class="cb-row"><div class="cb-key">FILTER</div><div class="cb-val">All respondents (n=975)</div></div>`;
  codebookPane += `<div class="cb-row"><div class="cb-key">METRIC</div><div class="cb-val">% endorsing each item (rows do not sum to 100%)</div></div>`;
  codebookPane += `<div class="cb-row"><div class="cb-key">WEIGHT</div><div class="cb-val cb-weight">Not a weight target</div></div>`;
  codebookPane += '</div>';

  // Banner area with metric header + multi-row table
  const blockTitle = (q.block_label || '').replace(/^Demographics\s*[—–-]\s*/i, '').toUpperCase();
  const metricTitle = `% YES — ${blockTitle}`;
  const subtitle = q.pane_extra && q.pane_extra.pane_subtitle
    ? q.pane_extra.pane_subtitle
    : 'Independent yes/no items; respondents may indicate multiple. Cells show % Yes per item.';
  let bannerArea = '<div class="item-data">';
  bannerArea += `<div class="metric-header">
    <div class="metric-label">${metricTitle}</div>
    <div class="metric-scale-note">${subtitle}</div>
  </div>`;

  // Build the table with one row per item
  const gop = segs.filter(s => s.party === 'GOP');
  const dem = segs.filter(s => s.party === 'DEM');
  let t = '<table class="banner-table demo-banner-table">';
  t += '<thead><tr class="party-band">';
  t += '<th class="rlbl"></th><th class="total-band">TOTAL</th>';
  t += `<th class="gop-band" colspan="${gop.length}">${DATA.study.party_band_a_label || 'GOP COALITION'}</th>`;
  t += `<th class="dem-band" colspan="${dem.length}">${DATA.study.party_band_b_label || 'DEM COALITION'}</th>`;
  t += '</tr><tr><th class="rlbl"></th>';
  t += '<th class="seg-head total-head">TOTAL<span class="seg-n">N=975</span></th>';
  segs.forEach(s => {
    t += `<th class="seg-head">${s.code}<span class="seg-n">N=${s.n}</span></th>`;
  });
  t += '</tr></thead><tbody>';
  (q.items || []).forEach(item => {
    const codeText = `<span class="inf-item-code-inline">${item.code}</span>`;
    const ctrlBadge = item.category === 'control' ? ' <span class="inf-tier-inline">CTRL</span>' : '';
    t += `<tr><td class="rlbl">${codeText}${ctrlBadge} ${item.wording}</td>`;
    const cuts = ['TOTAL', ...segs.map(s => s.code)];
    cuts.forEach((cut, idx) => {
      const cell = item.cuts[cut];
      const isTotal = (idx === 0);
      const colCls = isTotal ? 'total-cell' : '';
      if (cell) {
        const sigLevel = cell.sig || 0;
        t += `<td class="cell demo-cell ${colCls}" data-cut="${cut}" data-val="${cell.val}" data-n="${cell.n}" data-z="${cell.z || 0}" data-sig="${sigLevel}" data-metric="pct_yes" data-code="${item.code}" data-opt="${item.wording}">`;
        t += `${isTotal ? '' : sigDots(sigLevel)}<div class="cell-val top3">${cell.val.toFixed(0)}%</div></td>`;
      } else {
        t += `<td class="cell demo-cell empty ${colCls}" data-empty="1"></td>`;
      }
    });
    t += '</tr>';
  });
  t += '</tbody></table>';
  bannerArea += t + '</div>';

  return `<div class="item-block demo-block">${surveyPane}${codebookPane}${bannerArea}</div>`;
}

function renderDemoBannerArea(q, segs) {
  // Banner area = metric header + table, matching the Pre/Post / Critics structure.
  const blockLabel = (q.block_label || '').replace(/^Demographics\s*[—–-]\s*/i, '');
  const metricTitle = `% IN EACH CATEGORY${blockLabel ? ' — ' + blockLabel.toUpperCase() : ''}`;
  const nVal = q.freq && q.freq.TOTAL ? q.freq.TOTAL._n_total : 0;
  const subtitle = `% of segment selecting each option · n=${nVal} respondents${q.weight_relevant ? ' · weight-relevant variable' : ''}`;
  let h = '<div class="item-data">';
  h += `<div class="metric-header">
    <div class="metric-label">${metricTitle}</div>
    <div class="metric-scale-note">${subtitle}</div>
  </div>`;
  h += renderDemoBannerTable(q, segs);
  h += '</div>';
  return h;
}

function renderDemoSurveyPane(q) {
  let h = '<div class="survey-pane demo-pane">';
  h += `<div class="sp-header"><div class="sp-logo">PRISM</div><div>DEMO.${q.style.toUpperCase()}</div></div>`;
  h += `<div class="sp-progress"><div></div></div>`;
  h += `<div class="sp-progress-text">${q.id.toUpperCase()}</div>`;
  h += '<div class="sp-card">';

  // Derived variables: show note that pane represents source question
  if (q.style === 'derived') {
    h += `<div class="sp-stem">${q.wording.split('(')[0].trim()}</div>`;
    h += `<div class="demo-derived-note">Derived from QZIP</div>`;
    // Show the ZIP-entry mockup
    h += `<div class="sp-stem-secondary">Please enter your 5-digit Zip Code</div>`;
    h += `<div class="demo-zip-row">`;
    for (let i = 0; i < 5; i++) h += `<div class="demo-zip-box"></div>`;
    h += `</div>`;
    if (q.pane_extra && q.pane_extra.pane_subtitle) {
      h += `<div class="demo-derived-subtitle">${q.pane_extra.pane_subtitle}</div>`;
    }
    h += '</div></div>';
    return h;
  }

  // Stacked sub-questions (race_ethnic)
  if (q.pane_extra && q.pane_extra.stacked_questions) {
    q.pane_extra.stacked_questions.forEach((sq, i) => {
      h += `<div class="demo-stacked${i > 0 ? ' demo-stacked-sep' : ''}">`;
      h += `<div class="sp-stem">${sq.wording}</div>`;
      h += renderDemoOptions(sq.style, sq.options.map(o => o[1]), null);
      h += '</div>';
    });
    h += '</div></div>';
    return h;
  }

  // Standard
  h += `<div class="sp-stem">${q.wording}</div>`;
  if (q.pane_meta && q.pane_meta.pane_subtitle) {
    h += `<div class="sp-stem-secondary">${q.pane_meta.pane_subtitle}</div>`;
  }
  const paneOptions = (q.pane_extra && q.pane_extra.options_for_pane) || q.options.map(o => o[1]);

  // Find modal response for dropdowns
  let modalLabel = null;
  if (q.pane_extra && q.pane_extra.highlight_mode && q.freq && q.freq.TOTAL) {
    let modalPct = -1;
    for (const [v, lbl] of q.options) {
      const cell = q.freq.TOTAL[v];
      if (cell && cell.pct > modalPct) { modalPct = cell.pct; modalLabel = lbl; }
    }
  }
  h += renderDemoOptions(q.style, paneOptions, modalLabel, q);

  h += '</div></div>';
  return h;
}

function renderDemoOptions(style, options, modalLabel, q) {
  if (style === 'radio') {
    return options.map(lbl => {
      const isModal = (modalLabel && lbl === modalLabel);
      return `<div class="demo-opt radio${isModal ? ' selected' : ''}"><span class="demo-radio"></span>${lbl}</div>`;
    }).join('');
  }
  if (style === 'buttonselect') {
    return `<div class="demo-button-row">${options.map(lbl => {
      const isModal = (modalLabel && lbl === modalLabel);
      return `<div class="demo-button${isModal ? ' selected' : ''}">${lbl}</div>`;
    }).join('')}</div>`;
  }
  if (style === 'buttongrid') {
    return `<div class="demo-button-grid">${options.map(lbl => {
      const isModal = (modalLabel && lbl === modalLabel);
      return `<div class="demo-button${isModal ? ' selected' : ''}">${lbl}</div>`;
    }).join('')}</div>`;
  }
  if (style === 'dropdown') {
    return `<div class="demo-dropdown"><div class="demo-dropdown-stem">Please select from the dropdown menu</div>` +
      options.map(lbl => {
        const isModal = (modalLabel && lbl === modalLabel);
        return `<div class="demo-dropdown-opt${isModal ? ' selected' : ''}">${lbl}</div>`;
      }).join('') + '</div>';
  }
  if (style === 'numeric') {
    const boxes = (q && q.pane_extra && q.pane_extra.numeric_boxes) || 2;
    let h = '<div class="demo-age-row">';
    for (let i = 0; i < boxes; i++) h += '<div class="demo-age-box"></div>';
    h += '</div>';
    if (q && q.pane_meta) {
      const m = q.pane_meta.mean, med = q.pane_meta.median;
      if (m != null && med != null) {
        h += `<div class="demo-numeric-meta">Sample mean: <strong>${m}</strong> · median: <strong>${med}</strong></div>`;
      }
    }
    return h;
  }
  return '';
}

function renderDemoCodebookPane(q) {
  // Standardized 6-field codebook
  let h = '<div class="codebook-pane demo-cb">';

  // SOURCE
  h += `<div class="cb-row"><div class="cb-key">SOURCE</div><div class="cb-val cb-mono">${q.var}</div></div>`;
  if (q.derived_from) {
    h += `<div class="cb-row"><div class="cb-key">DERIVED</div><div class="cb-val cb-derived">${q.derived_from}</div></div>`;
  }

  // BLOCK
  h += `<div class="cb-row"><div class="cb-key">BLOCK</div><div class="cb-val">${q.block_label || ''}</div></div>`;

  // RECODE
  let recodeStr = '';
  if (q.recode && Object.keys(q.recode).length) {
    if (q.recode.show_only_yes) recodeStr = 'Banner shows % Yes only';
    else if (q.recode.ruca_collapse) recodeStr = '10 RUCA codes → 5 levels (Urban 1, Suburban 2-3, Exurban 4-6, Small Town Rural 7-9, Rural 10)';
    else recodeStr = JSON.stringify(q.recode);
  } else {
    recodeStr = '—';
  }
  h += `<div class="cb-row"><div class="cb-key">RECODE</div><div class="cb-val">${recodeStr}</div></div>`;

  // FILTER
  const n = q.freq && q.freq.TOTAL ? q.freq.TOTAL._n_total : 0;
  h += `<div class="cb-row"><div class="cb-key">FILTER</div><div class="cb-val">All respondents (n=${n})</div></div>`;

  // WEIGHT
  let weightStr = '';
  if (q.weight_relevant && q.weight_overall) {
    const wo = q.weight_overall;
    weightStr = `Range ${wo.min}-${wo.max} · median ${wo.median} · mean ${wo.mean}`;
  } else if (q.weight_relevant) {
    weightStr = 'Weight-relevant — stats pending';
  } else {
    weightStr = 'Not a weight target';
  }
  h += `<div class="cb-row"><div class="cb-key">WEIGHT</div><div class="cb-val cb-weight">${weightStr}</div></div>`;

  // METRIC
  h += `<div class="cb-row"><div class="cb-key">METRIC</div><div class="cb-val">% of segment in each category</div></div>`;

  if (q.pane_meta && q.pane_meta.continuous_var) {
    h += `<div class="cb-row"><div class="cb-key">CONTINUOUS</div><div class="cb-val cb-mono">${q.pane_meta.continuous_var} · mean ${q.pane_meta.mean} · median ${q.pane_meta.median}</div></div>`;
  }

  h += '</div>';
  return h;
}

function renderDemoBannerTable(q, segs) {
  const gop = segs.filter(s => s.party === 'GOP');
  const dem = segs.filter(s => s.party === 'DEM');

  let h = '<table class="banner-table demo-banner-table">';
  h += '<thead><tr class="party-band">';
  h += '<th class="rlbl"></th><th class="total-band">TOTAL</th>';
  h += `<th class="gop-band" colspan="${gop.length}">${DATA.study.party_band_a_label || 'GOP COALITION'}</th>`;
  h += `<th class="dem-band" colspan="${dem.length}">${DATA.study.party_band_b_label || 'DEM COALITION'}</th>`;
  h += '</tr><tr><th class="rlbl"></th>';
  h += '<th class="seg-head total-head">TOTAL<span class="seg-n">N=' + (q.freq && q.freq.TOTAL ? q.freq.TOTAL._n_total : '—') + '</span></th>';
  segs.forEach(s => {
    h += `<th class="seg-head">${s.code}<span class="seg-n">N=${s.n}</span></th>`;
  });
  h += '</tr></thead><tbody>';

  let displayOptions = q.options;
  if (q.recode && q.recode.show_only_yes) {
    displayOptions = q.options.filter(o => o[0] === 1);
  }

  displayOptions.forEach(([optVal, optLabel]) => {
    h += `<tr><td class="rlbl">${optLabel}</td>`;
    const cells = ['TOTAL', ...segs.map(s => s.code)];
    cells.forEach((cut, idx) => {
      const freqDict = q.freq[cut];
      const cell = freqDict ? freqDict[optVal] : null;
      const isTotal = (idx === 0);
      const colCls = isTotal ? 'total-cell' : '';
      if (cell) {
        const displayPct = cell.pct_wgt;
        const sigLevel = cell.sig || 0;
        h += `<td class="cell demo-cell ${colCls}" data-cut="${cut}" data-pct="${cell.pct}" data-pct-wgt="${cell.pct_wgt}" data-n="${cell.n}" data-n-wgt="${cell.n_wgt}" data-z="${cell.z || 0}" data-sig="${sigLevel}" data-opt="${optLabel}" data-var="${q.var}">`;
        h += `${isTotal ? '' : sigDots(sigLevel)}<div class="cell-val top3">${displayPct.toFixed(0)}%</div></td>`;
      } else {
        h += `<td class="cell demo-cell empty ${colCls}" data-empty="1"></td>`;
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

    'binary_set':  'Independent binary items (% Yes per item)',

    'composites':  'Derived composite scores',
  }[blk.kind] || blk.kind;
  h += `<div class="cb-row"><div class="cb-key">KIND</div><div class="cb-val">${kindLabel}</div></div>`;

  // METRIC
  let metricLabel = '';
  if (blk.kind === 'binary_set')  metricLabel = '% endorsing each behavior (independent, rows do not sum to 100%)';
  else if (blk.kind === 'categorical') metricLabel = '% in each bracket (rows sum to 100%)';
  else if (blk.kind === 'frequency') metricLabel = '% any activity (excludes "Never")';
  else if (blk.kind === 'composites') metricLabel = 'L1/L2/L3: % indicating tier · BCS: mean score (0-1)';
  h += `<div class="cb-row"><div class="cb-key">METRIC</div><div class="cb-val">${metricLabel}</div></div>`;

  // FILTER
  let nText = '';
  if (blk.kind === 'categorical') {
    nText = `All respondents (n=${blk.n_total || '—'})`;
  } else {
    nText = 'All respondents (n=975)';   // items vary per var; show approximate
  }
  h += `<div class="cb-row"><div class="cb-key">FILTER</div><div class="cb-val">${nText}</div></div>`;

  // FORMULAS — only for composites block
  if (blk.kind === 'composites' && blk.items) {
    blk.items.forEach(it => {
      if (it.formula) {
        h += `<div class="cb-row"><div class="cb-key">${it.code}</div><div class="cb-val cb-mono cb-formula">${it.formula}</div></div>`;
      }
    });
  }

  // WEIGHT
  h += `<div class="cb-row"><div class="cb-key">WEIGHT</div><div class="cb-val cb-weight">Not a weight target</div></div>`;

  h += '</div>';
  return h;
}

function renderInfBlockBannerArea(blk, segs) {

function renderInfBlockBannerTable(blk, segs) {
  const gop = segs.filter(s => s.party === 'GOP');
  const dem = segs.filter(s => s.party === 'DEM');

  let h = '<table class="banner-table demo-banner-table">';
  h += '<thead><tr class="party-band">';
  h += '<th class="rlbl"></th><th class="total-band">TOTAL</th>';
  h += `<th class="gop-band" colspan="${gop.length}">${DATA.study.party_band_a_label || 'GOP COALITION'}</th>`;
  h += `<th class="dem-band" colspan="${dem.length}">${DATA.study.party_band_b_label || 'DEM COALITION'}</th>`;
  h += '</tr><tr><th class="rlbl"></th>';
  const totalN = blk.kind === 'categorical' ? (blk.n_total || '—') : 975;
  h += `<th class="seg-head total-head">TOTAL<span class="seg-n">N=${totalN}</span></th>`;
  segs.forEach(s => {
    h += `<th class="seg-head">${s.code}<span class="seg-n">N=${s.n}</span></th>`;
  });
  h += '</tr></thead><tbody>';

  if (blk.kind === 'categorical') {
    // One row per option
    (blk.options || []).forEach(([optVal, optLabel]) => {
      h += `<tr><td class="rlbl">${optLabel}</td>`;
      const cuts = ['TOTAL', ...segs.map(s => s.code)];
      cuts.forEach((cut, idx) => {
        const freqDict = blk.freq[cut];
        const cell = freqDict ? freqDict[optVal] : null;
        const isTotal = (idx === 0);
        const colCls = isTotal ? 'total-cell' : '';
        if (cell) {
          const sigLevel = cell.sig || 0;
          h += `<td class="cell demo-cell ${colCls}" data-cut="${cut}" data-pct="${cell.pct}" data-pct-wgt="${cell.pct_wgt}" data-n="${cell.n}" data-n-wgt="${cell.n_wgt}" data-z="${cell.z || 0}" data-sig="${sigLevel}" data-opt="${optLabel}" data-var="${blk.var}">`;
          h += `${isTotal ? '' : sigDots(sigLevel)}<div class="cell-val top3">${cell.pct.toFixed(0)}%</div></td>`;
        } else {
          h += `<td class="cell demo-cell empty ${colCls}" data-empty="1"></td>`;
        }
      });
      h += '</tr>';
    });
  } else {
    // One row per item
    (blk.items || []).forEach(item => {
      const tierBadge = item.tier ? `<span class="inf-tier-inline">${item.tier}</span>` : '';
      const codeText  = `<span class="inf-item-code-inline">${item.code}</span>`;
      h += `<tr><td class="rlbl">${codeText}${tierBadge} ${item.wording}</td>`;
      const cuts = ['TOTAL', ...segs.map(s => s.code)];
      cuts.forEach((cut, idx) => {
        const cell = item.cuts[cut];
        const isTotal = (idx === 0);
        const colCls = isTotal ? 'total-cell' : '';
        if (cell) {
          const isMean = cell.metric === 'mean';
          const display = isMean ? cell.val.toFixed(3) : `${cell.val.toFixed(0)}%`;
          const sigLevel = cell.sig || 0;
          const statKey = isMean ? 't' : 'z';
          const statVal = cell[statKey] || 0;
          h += `<td class="cell demo-cell ${colCls}" data-cut="${cut}" data-val="${cell.val}" data-n="${cell.n}" data-${statKey}="${statVal}" data-sig="${sigLevel}" data-metric="${cell.metric}" data-code="${item.code}" data-opt="${item.wording}">`;
          h += `${isTotal ? '' : sigDots(sigLevel)}<div class="cell-val top3">${display}</div></td>`;
        } else {
          h += `<td class="cell demo-cell empty ${colCls}" data-empty="1"></td>`;
        }
      });
      h += '</tr>';
    });
  }
  h += '</tbody></table>';
  return h;
}

function renderTableHead(segments) {

function buildDist7(freq) {
  if (!freq) return '';
  const max = Math.max(...freq);
  let h = '<div class="dist7">';
  for (let k = 0; k < 7; k++) {
    const pct = freq[k];
    const barW = max > 0 ? Math.round(pct / max * 100) : 0;
    h += `<div class="d7-row k${k+1}"><span class="d7-k">${k+1}</span><span class="d7-bar" style="width:${barW}%"></span><span class="d7-pct">${pct < 1 ? '<1' : Math.round(pct)}%</span></div>`;
  }
  return h + '</div>';
}

function buildCell(stats, totalTop3, opts = {}) {
  if (!stats) return `<td class="cell" data-empty="1">—</td>`;
  const top3 = stats.top3, bot3 = stats.bot3, mean = stats.mean, n = stats.n;
  const dev = totalTop3 == null ? null : top3 - totalTop3;
  const bg = heatColor(dev);
  const cls = 'cell' + (opts.isTotal ? ' total-cell' : '');
  const sigLevel = opts.isTotal ? 0 : (stats.sig_top3 || 0);
  const dataAttrs = `data-top3="${top3}" data-bot3="${bot3}" data-mean="${mean}" data-n="${n}" data-cut="${opts.cut || ''}" data-row="${opts.row || ''}" data-item="${opts.item || ''}" data-sig="${sigLevel}" data-z="${stats.z_top3 || 0}"`;
  return `<td class="${cls}" style="background:${bg}" ${dataAttrs}>${sigDots(sigLevel)}
    <div class="top3">${fmtPct(top3)}</div>${buildDist7(stats.freq)}
    <div class="detail"><span class="lbl">m</span> ${fmtMean(mean)} <span class="lbl">b3</span> ${fmtPct(bot3)}</div></td>`;
}

function buildDeltaCell(delta, opts = {}) {
  if (!delta) return `<td class="cell" data-empty="1">—</td>`;
  const dt3 = delta.top3, dm = delta.mean;
  const cls = 'cell' + (opts.isTotal ? ' total-cell' : '');
  let signClass = 'zero';
  if (dt3 > 0.5) signClass = 'pos';
  else if (dt3 < -0.5) signClass = 'neg';
  const sigDelta = delta.sig_delta || 0;
  const sigDeltaVsRest = delta.sig_delta_vs_rest || 0;
  const dataAttrs = `data-dt3="${dt3}" data-dmean="${dm}" data-cut="${opts.cut || ''}" data-row="delta" data-item="${opts.item || ''}" ` +
    `data-npaired="${delta.n_paired || 0}" data-gain="${delta.switch_gain || 0}" data-loss="${delta.switch_loss || 0}" ` +
    `data-mp="${delta.mcnemar_p != null ? delta.mcnemar_p : ''}" data-method="${delta.mcnemar_method || ''}" ` +
    `data-tvr="${delta.t_delta_vs_rest != null ? delta.t_delta_vs_rest : ''}" data-pvr="${delta.p_delta_vs_rest != null ? delta.p_delta_vs_rest : ''}" ` +
    `data-sigd="${sigDelta}" data-sigdvr="${sigDeltaVsRest}"`;
  let distHtml = '';
  if (delta.df1 !== undefined) {
    distHtml = '<div class="dist7">';
    for (let k = 0; k < 7; k++) {
      const dv = delta['df' + (k+1)];
      const sign = dv > 0 ? '+' : '';
      distHtml += `<div class="d7-row k${k+1}"><span class="d7-k">${k+1}</span><span class="d7-bar" style="width:${Math.min(100, Math.abs(dv)*5)}%; opacity:${Math.min(1, Math.abs(dv)/10)}"></span><span class="d7-pct">${sign}${Math.round(dv*10)/10}</span></div>`;
    }
    distHtml += '</div>';
  }
  // Sig marker for paired McNemar (Option 1 — drives the dots)
  const sigMark = sigDots3(sigDelta);
  // Render: zero shows as em-dash; nonzero shows signed number without "pp" suffix
  let valHtml;
  if (Math.abs(dt3) < 0.5) {
    valHtml = `<div class="delta-val zero">—</div>`;
  } else {
    const sign = dt3 > 0 ? '+' : '';
    valHtml = `<div class="delta-val ${signClass}">${sign}${Math.round(dt3 * 10) / 10}</div>`;
  }
  return `<td class="${cls}" ${dataAttrs}>${sigMark}${valHtml}${distHtml}<div class="detail"><span class="lbl">Δm</span> ${fmtDelta(dm, '')}</div></td>`;
}

function renderScaleCircles(selectedIdx) {
  let h = '<div class="sp-scale">';
  for (let i = 1; i <= 7; i++) {
    h += `<div class="dot${i === selectedIdx ? ' filled pos-' + i : ''}"></div>`;
    if (i < 7) h += '<div class="conn"></div>';
  }
  return h + '</div>';
}

function renderSurveyPane(survey) {
  if (!survey) return '<div class="survey-pane"><div class="sp-card">—</div></div>';
  const style = survey.style || 'CARDSHUFFLE';
  const selected = survey.selected_pos || 4;
  let h = '<div class="survey-pane' + (style === 'SEMANTIC' ? ' semantic' : style === 'RANKSORT' ? ' ranksort' : '') + '">';
  h += `<div class="sp-header"><div class="sp-logo">PRISM</div><div>STYLE.${style}</div></div>`;
  h += `<div class="sp-progress"><div></div></div>`;
  h += `<div class="sp-progress-text">${survey.progress || ''}</div>`;
  if (survey.intro) h += `<div class="sp-intro">${survey.intro}</div>`;
  h += `<div class="sp-card"><div class="sp-stem">${survey.stem || ''}</div>`;

  if (style === 'SEMANTIC') {
    h += `<div class="sp-poles"><div class="sp-pole left">${survey.pole_left || ''}</div><div class="sp-pole right">${survey.pole_right || ''}</div></div>`;
    h += renderScaleCircles(selected);
  } else if (style === 'RANKSORT') {
    h += `<div class="sp-rank-list">`;
    (survey.items || []).forEach((it, i) => {
      const focal = it === survey.focal;
      h += `<div class="sp-rank-item${focal ? ' focal' : ''}"><span class="sp-rank-pos">${i+1}</span>${it}</div>`;
    });
    h += `</div>`;
  } else {
    if (survey.text) h += `<div class="sp-statement">${survey.text}</div>`;
    h += renderScaleCircles(selected);
    h += `<div class="sp-anchors">
      <div>${(survey.anchor_left || 'Strongly Disagree').replace(/\n/g, '<br>')}</div>
      <div>${(survey.anchor_center || 'Neutral').replace(/\n/g, '<br>')}</div>
      <div>${(survey.anchor_right || 'Strongly Agree').replace(/\n/g, '<br>')}</div>
    </div>`;
  }
  h += `</div><div class="sp-continue">CONTINUE ›</div><div class="sp-footer">Responses held confidential</div></div>`;
  return h;
}

function renderCodebookPane(cb) {
  if (!cb) return '<div class="codebook-pane">—</div>';
  let h = '<div class="codebook-pane"><div class="cb-title">Codebook</div>';
  const fields = [
    ['Var (PRE)', cb.var_pre, true], ['Var (POST)', cb.var_post, true], ['Var', cb.var, true],
    ['Scale', cb.scale_type, false], ['Recode', cb.recode, false],
    ['Filter', cb.filter, false], ['Block', cb.block, false], ['Composite', cb.composite, true],
  ];
  fields.forEach(([k, v, mono]) => {
    if (!v) return;
    h += `<div class="cb-row"><span class="cb-key">${k}</span><span class="cb-val${mono ? ' mono' : ''}">${v}</span></div>`;
  });
  if (cb.design_note) h += `<div class="cb-note" style="margin-top:8px">${cb.design_note}</div>`;
  if (cb.citation) h += `<div class="cb-cite">${cb.citation}</div>`;
  return h + '</div>';
}

function renderMetricHeader(item) {
  if (!item.metric_label) return '';
  // Scale-aware bottom-N-box label. N = ceil(scale/3): 7→3, 5→2, 4→2, 3→1.
  // Binary items (scale 2 or implicit) get no box toggle.
  const scale = item.scale;
  const showToggles = typeof scale === 'number' && scale >= 3;
  const N = showToggles ? Math.ceil(scale / 3) : null;
  const blockId = item.id || ('blk-' + Math.random().toString(36).slice(2, 9));
  let togglesHTML = '';
  if (showToggles) {
    togglesHTML = `<div class="block-toggle-bar">
      <label><input type="checkbox" onchange="toggleBlock('${blockId}', 'is-expanded', this.checked)"> Show mean and bottom-${N}-box under each cell</label>
      <label><input type="checkbox" onchange="toggleBlock('${blockId}', 'is-fulldist', this.checked)"> Show full frequency distribution under each cell</label>
    </div>`;
  }
  return `<div class="metric-header" data-block-id="${blockId}">
    <div class="metric-text">
      <div class="metric-label">${item.metric_label}</div>
      ${item.metric_label_scale ? `<div class="metric-scale-note">${item.metric_label_scale}</div>` : ''}
    </div>
    ${togglesHTML}
  </div>`;
}

// Per-block toggle handler — finds the enclosing .item-block of the toggle's
// metric-header and toggles the class on that block only.
function toggleBlock(blockId, klass, on) {
  const header = document.querySelector(`.metric-header[data-block-id="${blockId}"]`);
  if (!header) return;
  const block = header.closest('.item-block');
  if (block) block.classList.toggle(klass, on);
}

function renderPrePostItem(pp, segments) {
  const res = DATA.pp_results[pp.id];
  const totalT3Pre = res.pre['TOTAL'] ? res.pre['TOTAL'].top3 : null;
  const totalT3Post = res.post['TOTAL'] ? res.post['TOTAL'].top3 : null;
  const deltaWithDist = {};
  for (const cut of Object.keys(res.delta)) {
    const d = { ...res.delta[cut] };
    const pre = res.pre[cut], post = res.post[cut];
    if (pre && post) {
      for (let k = 0; k < 7; k++) d['df' + (k+1)] = +(post.freq[k] - pre.freq[k]).toFixed(1);
    }
    deltaWithDist[cut] = d;
  }
  let html = `<div class="item-block">` + renderSurveyPane(pp.survey) + renderCodebookPane(pp.codebook);
  html += `<div class="item-data">` + renderMetricHeader(pp) + `<table class="banner-table">` + renderTableHead(segments) + `<tbody>`;
  html += `<tr class="pre"><td class="rlbl">PRE<span class="rlbl-sub">before exposure</span></td>`;
  html += buildCell(res.pre['TOTAL'], null, { isTotal: true, cut: 'TOTAL', row: 'pre', item: pp.id });
  segments.forEach(s => html += buildCell(res.pre[s.code], totalT3Pre, { cut: s.code, row: 'pre', item: pp.id }));
  html += '</tr><tr class="post"><td class="rlbl">POST<span class="rlbl-sub">after exposure</span></td>';
  html += buildCell(res.post['TOTAL'], null, { isTotal: true, cut: 'TOTAL', row: 'post', item: pp.id });
  segments.forEach(s => html += buildCell(res.post[s.code], totalT3Post, { cut: s.code, row: 'post', item: pp.id }));
  html += '</tr><tr class="delta"><td class="rlbl">Δ<span class="rlbl-sub">POST − PRE</span></td>';
  html += buildDeltaCell(deltaWithDist['TOTAL'], { isTotal: true, cut: 'TOTAL', item: pp.id });
  segments.forEach(s => html += buildDeltaCell(deltaWithDist[s.code], { cut: s.code, item: pp.id }));
  html += `</tr></tbody></table></div></div>`;
  return html;
}

function renderSingleItem(item, segments) {
  const res = DATA.item_results[item.id];
  const totalT3 = res['TOTAL'] ? res['TOTAL'].top3 : null;
  let html = `<div class="item-block">` + renderSurveyPane(item.survey) + renderCodebookPane(item.codebook);
  html += `<div class="item-data">` + renderMetricHeader(item) + `<table class="banner-table">` + renderTableHead(segments) + `<tbody>`;
  html += `<tr><td class="rlbl">% Top-3<span class="rlbl-sub">Agree</span></td>`;
  html += buildCell(res['TOTAL'], null, { isTotal: true, cut: 'TOTAL', item: item.id });
  segments.forEach(s => html += buildCell(res[s.code], totalT3, { cut: s.code, item: item.id }));
  html += `</tr></tbody></table></div></div>`;
  return html;
}

const popover = document.getElementById('popover');
document.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell || cell.dataset.empty) { popover.style.display = 'none'; return; }
  showPopover(cell);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') popover.style.display = 'none'; });
function showPopover(cell) {
  const L = DATA.labels || {};
  const row = cell.dataset.row;
  let html = '';
  if (row === 'delta') {
    const dt3 = parseFloat(cell.dataset.dt3);
    const dm  = parseFloat(cell.dataset.dmean);
    const cut = cell.dataset.cut || '';
    const npr = parseInt(cell.dataset.npaired) || 0;
    const gain = parseInt(cell.dataset.gain) || 0;
    const loss = parseInt(cell.dataset.loss) || 0;
    const mp = cell.dataset.mp !== '' ? parseFloat(cell.dataset.mp) : null;
    const methodKey = cell.dataset.method || '';
    const methodText = L[methodKey] || methodKey;
    const sigd = parseInt(cell.dataset.sigd) || 0;
    const sigdvr = parseInt(cell.dataset.sigdvr) || 0;
    const tvr = cell.dataset.tvr !== '' ? parseFloat(cell.dataset.tvr) : null;
    const pvr = cell.dataset.pvr !== '' ? parseFloat(cell.dataset.pvr) : null;
    const sigText = [
      L.sig_d_ns   || 'not sig',
      L.sig_d_10   || 'sig at p<.10',
      L.sig_d_05   || 'sig at p<.05',
      L.sig_d_01   || 'sig at p<.01',
    ][sigd];
    const sigVsRestText = [
      L.sig_dvr_ns || 'n.s.',
      L.sig_dvr_10 || 'p<.10',
      L.sig_dvr_05 || 'p<.05',
      L.sig_dvr_01 || 'p<.01',
    ][sigdvr];
    let dtDisp = Math.abs(dt3) < 0.5 ? '—' : ((dt3 > 0 ? '+' : '') + (Math.round(dt3*10)/10) + ' pp');
    const switchersTpl = L.pop_paired_switchers || '{gain} respondents gained top-3 · {loss} lost top-3';
    const switchers = switchersTpl.replace('{gain}', gain).replace('{loss}', loss);
    const noDiscord = L.pop_paired_no_discord || 'no discordant pairs';
    html = `<div class="pop-head">${cut} · Δ (POST − PRE)</div>
      <div class="pop-row"><span class="lbl">${L.pop_delta_top3 || 'Δ Top-3'}</span><span class="val">${dtDisp}</span></div>
      <div class="pop-row"><span class="lbl">${L.pop_delta_mean || 'Δ Mean'}</span><span class="val">${fmtDelta(dm, '')}</span></div>
      <div class="pop-row"><span class="lbl">${L.pop_n_paired || 'n (paired)'}</span><span class="val">${npr}</span></div>
      <div class="pop-sig"><strong>${L.pop_paired_title || 'Paired test (McNemar)'}</strong><br>
        ${switchers}<br>
        ${mp !== null ? 'p = ' + mp.toFixed(3) + ' · ' + sigText : noDiscord}<br>
        <em style="opacity:0.7">${methodText}</em></div>`;
    if (tvr !== null && pvr !== null) {
      html += `<div class="pop-sig"><strong>${L.pop_dvr_title || 'Δ vs. rest of sample'}</strong><br>
        t = ${tvr.toFixed(2)} · p = ${pvr.toFixed(3)} · ${sigVsRestText}<br>
        <em style="opacity:0.7">${L.pop_dvr_subtitle || 'Differential persuadability'}</em></div>`;
    }
  } else if (cell.dataset.opt !== undefined) {
    // Demographics / Influencer cell — show unweighted figure + sig if available.
    const opt = cell.dataset.opt;
    const cut = cell.dataset.cut;
    const sig = parseInt(cell.dataset.sig) || 0;
    const z = cell.dataset.z !== undefined ? parseFloat(cell.dataset.z) : null;
    const t = cell.dataset.t !== undefined ? parseFloat(cell.dataset.t) : null;
    const n = parseInt(cell.dataset.n);
    let sigText = L.sig_zr_ns || 'not sig vs. rest of sample';
    if (sig === 1) sigText = L.sig_zr_05 || 'sig at p<.05 vs. rest of sample';
    if (sig === 2) sigText = L.sig_zr_01 || 'sig at p<.01 vs. rest of sample';
    // Use the appropriate displayed value: pct (for proportions) or val (for means/influencer)
    let displayValue;
    if (cell.dataset.pct !== undefined) {
      displayValue = parseFloat(cell.dataset.pct).toFixed(1) + '%';
    } else if (cell.dataset.val !== undefined) {
      const v = parseFloat(cell.dataset.val);
      const isMean = cell.dataset.metric === 'mean';
      displayValue = isMean ? v.toFixed(3) : v.toFixed(1) + '%';
    } else {
      displayValue = '—';
    }
    html = `<div class="pop-head">${cut} · ${opt}</div>
      <div class="pop-row"><span class="lbl">Unweighted</span><span class="val">${displayValue}</span></div>
      <div class="pop-row"><span class="lbl">n</span><span class="val">${n}</span></div>`;
    // Show sig line if we have a stat (cut !== TOTAL)
    if (cut !== 'TOTAL' && (z !== null || t !== null)) {
      const statLine = t !== null
        ? `t = ${t.toFixed(2)} · ${sigText}`
        : `z = ${z.toFixed(2)} · ${sigText}`;
      html += `<div class="pop-sig">${statLine}</div>`;
    }
  } else {
    const t3 = parseFloat(cell.dataset.top3), b3 = parseFloat(cell.dataset.bot3);
    const m = parseFloat(cell.dataset.mean), n = parseInt(cell.dataset.n);
    const sig = parseInt(cell.dataset.sig) || 0;
    const z = parseFloat(cell.dataset.z) || 0;
    const head = cell.dataset.row ? cell.dataset.row.toUpperCase() : '';
    let sigText = L.sig_zr_ns || 'not sig vs. rest of sample';
    if (sig === 1) sigText = L.sig_zr_05 || 'sig at p<.05 vs. rest of sample';
    if (sig === 2) sigText = L.sig_zr_01 || 'sig at p<.01 vs. rest of sample';
    html = `<div class="pop-head">${cell.dataset.cut}${head ? ' · ' + head : ''}</div>
      <div class="pop-row"><span class="lbl">${L.pop_top3 || 'Top-3 (5-7)'}</span><span class="val">${fmtPct(t3)}</span></div>
      <div class="pop-row"><span class="lbl">${L.pop_bot3 || 'Bot-3 (1-3)'}</span><span class="val">${fmtPct(b3)}</span></div>
      <div class="pop-row"><span class="lbl">${L.pop_mean || 'Mean'}</span><span class="val">${fmtMean(m)}</span></div>
      <div class="pop-row"><span class="lbl">${L.pop_n || 'n'}</span><span class="val">${n}</span></div>
      <div class="pop-sig">z = ${z.toFixed(2)} · ${sigText}</div>`;
  }
  popover.innerHTML = html;
  popover.style.display = 'block';
  const rect = cell.getBoundingClientRect();
  const popW = 220, popH = popover.offsetHeight;
  let left = rect.left + rect.width / 2 - popW / 2 + window.scrollX;
  let top  = rect.bottom + 8 + window.scrollY;
  if (top + popH > window.scrollY + window.innerHeight) top = rect.top - popH - 8 + window.scrollY;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
}

function flattenForInspector() {
  const rows = [];

  // ── Critics-style items (Top-3 / Bot-3 / Mean / Net) ──────────────
  DATA.items.forEach(it => {
    const res = DATA.item_results[it.id];
    if (!res) return;
    Object.entries(res).forEach(([cut, s]) => {
      rows.push({ source: 'items', item: it.id, code: it.code, wave: '', cut,
        n: s.n, n_wgt: s.n_wgt, mean: s.mean, top3: s.top3, bot3: s.bot3, net: s.net,
        pct: '', val: '', metric: 'top3',
        sig: s.sig_top3 || 0, z: s.z_top3 || 0 });
    });
  });

  // ── Pre/Post (PRE and POST waves) ─────────────────────────────────
  DATA.pre_post.forEach(pp => {
    const r = DATA.pp_results[pp.id];
    if (!r) return;
    Object.entries(r.pre || {}).forEach(([cut, s]) => {
      rows.push({ source: 'pre_post', item: pp.id, code: pp.code, wave: 'PRE', cut,
        n: s.n, n_wgt: s.n_wgt, mean: s.mean, top3: s.top3, bot3: s.bot3, net: s.net,
        pct: '', val: '', metric: 'top3',
        sig: s.sig_top3 || 0, z: s.z_top3 || 0 });
    });
    Object.entries(r.post || {}).forEach(([cut, s]) => {
      rows.push({ source: 'pre_post', item: pp.id, code: pp.code, wave: 'POST', cut,
        n: s.n, n_wgt: s.n_wgt, mean: s.mean, top3: s.top3, bot3: s.bot3, net: s.net,
        pct: '', val: '', metric: 'top3',
        sig: s.sig_top3 || 0, z: s.z_top3 || 0 });
    });
  });

  // ── Demographics (frequency distributions per option × cut) ───────
  (DATA.demographics || []).forEach(q => {
    if (q.style === 'binary_set' && q.items) {
      // Personal Contact and similar — items × cuts
      q.items.forEach(it => {
        Object.entries(it.cuts || {}).forEach(([cut, cell]) => {
          rows.push({ source: 'demos', item: it.var, code: it.code, wave: '', cut,
            n: cell.n || '', n_wgt: '', mean: '', top3: '', bot3: '', net: '',
            pct: cell.val !== undefined ? cell.val : '',
            val: '',
            metric: 'pct_yes',
            sig: cell.sig || 0, z: cell.z || 0 });
        });
      });
    } else if (q.freq) {
      // Standard categorical demographic — options × cuts
      (q.options || []).forEach(([optVal, optLabel]) => {
        Object.entries(q.freq).forEach(([cut, freqDict]) => {
          const cell = freqDict[optVal] || freqDict[String(optVal)];
          if (!cell) return;
          rows.push({ source: 'demos', item: q.var, code: `${q.id}=${optLabel}`, wave: '', cut,
            n: cell.n, n_wgt: cell.n_wgt,
            mean: '', top3: '', bot3: '', net: '',
            pct: cell.pct, val: '',
            metric: 'pct',
            sig: cell.sig || 0, z: cell.z || 0 });
        });
      });
    }
  });

  // ── Influencer360 (5 blocks, each with items or freq) ─────────────
  (DATA.influencer || []).forEach(blk => {
    if (blk.kind === 'categorical' && blk.freq) {
      (blk.options || []).forEach(([optVal, optLabel]) => {
        Object.entries(blk.freq).forEach(([cut, freqDict]) => {
          const cell = freqDict[optVal] || freqDict[String(optVal)];
          if (!cell) return;
          rows.push({ source: 'influencer', item: blk.var, code: `${blk.id}=${optLabel}`, wave: '', cut,
            n: cell.n, n_wgt: cell.n_wgt,
            mean: '', top3: '', bot3: '', net: '',
            pct: cell.pct, val: '',
            metric: 'pct',
            sig: cell.sig || 0, z: cell.z || 0 });
        });
      });
    } else if (blk.items) {
      blk.items.forEach(it => {
        Object.entries(it.cuts || {}).forEach(([cut, cell]) => {
          rows.push({ source: 'influencer', item: it.var, code: it.code, wave: '', cut,
            n: cell.n || '', n_wgt: '',
            mean: cell.metric === 'mean' ? cell.val : '',
            top3: '', bot3: '', net: '',
            pct: cell.metric !== 'mean' ? cell.val : '',
            val: cell.val !== undefined ? cell.val : '',
            metric: cell.metric || '',
            sig: cell.sig || 0,
            z: cell.z !== undefined ? cell.z : (cell.t !== undefined ? cell.t : 0) });
        });
      });
    }
  });

  // ── HIV Stigma extras: Knowledge + Composites ─────────────────────
  if (DATA.stigma_extras) {
    if (DATA.stigma_extras.knowledge && DATA.stigma_extras.knowledge.items) {
      DATA.stigma_extras.knowledge.items.forEach(it => {
        Object.entries(it.cuts || {}).forEach(([cut, cell]) => {
          rows.push({ source: 'knowledge', item: it.var, code: it.code, wave: '', cut,
            n: cell.n || '', n_wgt: '',
            mean: '', top3: '', bot3: '', net: '',
            pct: cell.val !== undefined ? cell.val : '',
            val: '',
            metric: 'pct_aware',
            sig: cell.sig || 0, z: cell.z || 0 });
        });
      });
    }
    if (DATA.stigma_extras.composites && DATA.stigma_extras.composites.items) {
      DATA.stigma_extras.composites.items.forEach(it => {
        Object.entries(it.cuts || {}).forEach(([cut, cell]) => {
          rows.push({ source: 'composites', item: it.code, code: it.code, wave: '', cut,
            n: cell.n || '', n_wgt: '',
            mean: cell.val,
            top3: '', bot3: '', net: '',
            pct: '', val: cell.val,
            metric: 'mean',
            sig: cell.sig || 0,
            z: cell.t !== undefined ? cell.t : 0 });
        });
      });
    }
  }

  return rows;
}
function renderInspector() {
  const filter = (document.getElementById('filter-input').value || '').toLowerCase();
  const rows = flattenForInspector().filter(r =>
    !filter || [r.source, r.item, r.code, r.cut, r.wave, r.metric].some(v => (v || '').toString().toLowerCase().includes(filter)));

  // Group counts by source for the legend
  const bySource = {};
  rows.forEach(r => { bySource[r.source] = (bySource[r.source] || 0) + 1; });
  const sourceTags = Object.entries(bySource).map(([s, n]) => `<span style="margin-right:10px"><code>${s}</code>: ${n}</span>`).join('');

  let h = `<div style="margin-bottom:10px;color:var(--ink-soft);font-size:11px">
    <strong>${rows.length} rows</strong> · filter by item, code, cut, wave, source, or metric ·
    sources: ${sourceTags}
  </div>`;
  h += '<table><thead><tr><th>source</th><th>item</th><th>code</th><th>wave</th><th>cut</th><th>n</th><th>metric</th><th>top3</th><th>bot3</th><th>mean</th><th>net</th><th>pct</th><th>val</th><th>stat</th><th>sig</th></tr></thead><tbody>';
  rows.forEach(r => {
    const fmt = (v, d=1) => (v === '' || v === undefined || v === null) ? '' : (typeof v === 'number' ? v.toFixed(d) : v);
    h += `<tr>
      <td><code>${r.source}</code></td>
      <td>${r.item}</td>
      <td>${r.code || ''}</td>
      <td>${r.wave || ''}</td>
      <td>${r.cut}</td>
      <td>${r.n}</td>
      <td>${r.metric || ''}</td>
      <td>${fmt(r.top3, 1)}</td>
      <td>${fmt(r.bot3, 1)}</td>
      <td>${fmt(r.mean, 3)}</td>
      <td>${fmt(r.net, 1)}</td>
      <td>${fmt(r.pct, 1)}</td>
      <td>${fmt(r.val, 3)}</td>
      <td>${(r.z || 0).toFixed(2)}</td>
      <td>${r.sig === 2 ? '••' : r.sig === 1 ? '•' : ''}</td>
    </tr>`;
  });
  h += '</tbody></table>';
  document.getElementById('inspector-content').innerHTML = h;
}
function toggleInspector() {
  const el = document.getElementById('inspector');
  el.classList.toggle('open');
  if (el.classList.contains('open')) renderInspector();
}
renderAll();
</script>

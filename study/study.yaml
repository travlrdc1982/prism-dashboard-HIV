  - battery: mfq
    id: QMFQr5
    code: MFQ_FAIR
    wording: Whether or not someone was treated fairly and got what they deserved.
    metric_label: '% RELEVANT — Fairness: Just Deserts'
  - battery: mfq
    id: QMFQr6
    code: MFQ_LIBERTY
    wording: Whether or not a person's individual freedom or right to make their own choices was restricted.
    metric_label: '% RELEVANT — Liberty: Individual Freedom Restricted'
  - battery: mfq
    id: QMFQr7
    code: MFQ_LOYALTY
    wording: Whether or not someone was loyal to the people and groups they belong to.
    metric_label: '% RELEVANT — Loyalty: In-Group Loyalty'
  - battery: mfq
    id: QMFQr8
    code: MFQ_AUTHORITY
    wording: Whether or not someone showed proper respect for authority and traditional social roles.
    metric_label: '% RELEVANT — Authority: Respect for Tradition'
  - battery: critics
    id: QCRITICr1
    code: CRITIC_1
    wording: People who contract HIV as a result of their own sexual behavior are largely responsible for managing
      the consequences.
    metric_label: '% AGREE — HIV Result of Sexual Choices'
  - battery: critics
    id: QCRITICr2
    code: CRITIC_2
    wording: Providing government funding for HIV prevention programs sends the wrong message by reducing the consequences
      of risky behavior.
    metric_label: '% AGREE — Funding Prevention: Moral Hazard'
  - battery: critics
    id: QCRITICr3
    code: CRITIC_3
    wording: HIV is no longer the public health emergency it once was — other health crises deserve more attention
      and resources today.
    metric_label: '% AGREE — Not an Emergency Anymore'
  - battery: critics
    id: QCRITICr4
    code: CRITIC_4
    wording: With limited resources for public health, it makes sense to shift funding away from HIV toward conditions
      like the opioid crisis and mental health.
    metric_label: '% AGREE — Opioid Crisis / Mental Health Bigger Priority'
  - battery: critics
    id: QCRITICr5
    code: CRITIC_5
    wording: Reducing the federal deficit and controlling government spending should take priority over maintaining
      current levels of HIV funding.
    metric_label: '% AGREE — Control Deficit Spending Bigger Priority'
  - battery: critics
    id: QCRITICr6
    code: CRITIC_6
    wording: HIV treatment and prevention programs have received a disproportionate share of public health funding
      relative to the size of the affected population.
    metric_label: '% AGREE — Spending on HIV Disproportionate to Impact'
  - battery: critics
    id: QCRITICr7
    code: CRITIC_7
    wording: HIV is primarily a problem affecting specific communities and lifestyle choices — most Americans do
      not need to see it as their concern.
    metric_label: '% AGREE — HIV Affects Communities and Lifestyle Choices'
  - battery: critics
    id: QCRITICr8
    code: CRITIC_8
    wording: The people most affected by HIV in the United States are concentrated in communities with behaviors
      and values very different from most Americans.
    metric_label: '% AGREE — HIV Affects Communities Different from Most Americans'
  - battery: critics
    id: QCRITICr9
    code: CRITIC_9
    wording: Resources spent on HIV primarily benefit populations in large cities — rural and suburban communities
      have more pressing health needs.
    metric_label: '% AGREE — Resource Needs are Outside of Urban Areas'
  - battery: critics
    id: QCRITICr10
    code: CRITIC_10
    wording: States should have full flexibility to decide how to allocate HIV prevention and treatment funding
      rather than being directed by Washington.
    metric_label: '% AGREE — States Should Decide'
  - battery: critics
    id: QCRITICr11
    code: CRITIC_11
    wording: Federal HIV programs have too much waste and inefficiency to justify continued investment at current
      levels.
    metric_label: '% AGREE — Waste in Federal HIV Programs'
  pre_post:
  - id: PP1
    pre_var: XQPRE_1r1r1
    post_var: XPOST_1r1r1
    code: PRE_1 / POST_1
    section: prepost
    wording: People have different views about which health issues should be the top priority for elected officials.
      Please rank the following health issues from 1 (most important) to 7 (least important). [Rank shown for HIV/AIDS,
      recoded so 7 = top priority.]
    scale_anchors:
    - Ranked LAST (1)
    - Middle (4)
    - Ranked FIRST (7)
    survey:
      style: RANKSORT
      progress: 1 of 7 issues
      stem: Drag each issue to its ranking (1 = most important).
      items:
      - HIV/AIDS
      - Cancer
      - Mental health and addiction
      - Obesity and Diabetes
      - Heart disease
      - Alzheimer's and dementia
      - Maternal health
      focal: HIV/AIDS
    codebook:
      var_pre: QPRE_1r1 → XQPRE_1r1r1 (recoded 8 − rank, so 7 = top priority)
      var_post: QPOST_1r1 → XPOST_1r1r1
      scale_type: Forced rank (1–7) across 7 health issues
      filter: All respondents (n=975)
      block: PRE block · randomized issue order
      recode: 'Reverse to ascending priority: XQPRE_1r1r1 = 8 − QPRE_1r1'
      design_note: Single-item priority rank for HIV/AIDS extracted from the full ranking task.
    metric_label: '% RANKING HIV/AIDS A TOP-3 PRIORITY'
    metric_label_scale: Top-3 positions (5-7) of recoded 7-pt rank (7 = top priority)

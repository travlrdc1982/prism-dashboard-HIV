      style: CARDSHUFFLE
      progress: 6 of 7 PRE items
      stem: Some states are considering reducing eligibility for HIV treatment assistance programs in order to address
        budget shortfalls and reduce the burden on taxpayers. Do you support or oppose such reductions?
      text: ''
      anchor_left: 'Strongly

        Oppose'
      anchor_center: Neutral
      anchor_right: 'Strongly

        Support'
    codebook:
      var_pre: QPRE_6 → XQPRE_6R
      var_post: QPOST_6 → XPOST_6R
      scale_type: 7-pt support-oppose, REVERSED so high = pro-access
      filter: All respondents
      block: PRE Block A
      recode: XQPRE_6R = 8 − QPRE_6 (reverse-coded)
      design_note: Counter-pressure / reductions item. Reversed so all PRE/POST items run in the same pro-access
        direction.
    metric_label: '% OPPOSE — Reductions in HIV Treatment Eligibility'
    metric_label_scale: Top-3 Box (5-7) of reverse-coded 7-pt scale (high = pro-access)
  - id: PP7
    pre_var: QPRE_7r1
    post_var: QPOST_7r1
    code: PRE_7 / POST_7
    section: prepost
    wording: Which statement comes closest to your view? (1) "We already have medicines that effectively treat and
      prevent HIV…" vs. (7) "The next generation of HIV treatment and prevention will do what existing medicines
      cannot. That innovation requires continued investment."
    scale_anchors:
    - 'Strong A: access (1)'
    - Neutral (4)
    - 'Strong B: innovation (7)'
    survey:
      style: SEMANTIC
      progress: 7 of 7 PRE items
      stem: Which statement comes closer to your view?
      pole_left: We already have medicines that effectively treat and prevent HIV. The focus should be on getting
        those medicines to the people who need them — not on developing newer, more expensive options.
      pole_right: The next generation of HIV treatment and prevention will do what existing medicines cannot — make
        adherence easier, reach more people, and move us closer to a cure. That innovation requires continued investment.
    codebook:
      var_pre: QPRE_7r1
      var_post: QPOST_7r1
      scale_type: 7-pt semantic differential (1–7)
      filter: All respondents
      block: PRE Block A
      recode: None
      design_note: Forced-choice instrumental outcome. High = pro-innovation.
    metric_label: '% PRO-INNOVATION — Forced Choice (Access vs. Innovation)'
    metric_label_scale: Top-3 Box (5-7) of 7-pt semantic differential (high = innovation pole)

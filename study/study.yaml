  batteries:
    critics:
      section: critics
      total: 11
      scale: 7
      scale_anchors:
      - Strongly DISAGREE
      - Neither / Neutral
      - Strongly AGREE
      survey:
        style: CARDSHUFFLE
        intro: You'll now see a handful of statements drawn from people who see this issue from a variety of perspectives.
          We're interested in your honest reaction to how these arguments land with you.
        stem: For each statement, indicate how much you agree or disagree…
        anchor_left: 'Strongly

          Disagree'
        anchor_center: 'Neutral /

          Unsure'
        anchor_right: 'Strongly

          Agree'
      codebook:
        scale_type: 7-pt Likert (agree-disagree)
        filter: All respondents (n=957 valid)
        block: Critics Messages (randomized order, k=11 items)
        recode: None
        design_note: Order of critic messages rotated before and after outcome pre-test measures.
      metric_label_scale: Top-3 Box (5-7) of 7-pt agree-disagree scale
    hivstigma:
      section: stigma
      total: 13
      scale: 7
      scale_anchors:
      - Strongly DISAGREE
      - Neither / Neutral
      - Strongly AGREE
      survey:
        style: CARDSHUFFLE
        intro: People hold many different views on the following issues. Please tell us how much you agree or disagree
          with each statement. There are no right or wrong answers.
        stem: For each statement, indicate how much you agree or disagree…
        anchor_left: 'Strongly

          Disagree'
        anchor_center: 'Neutral /

          Unsure'
        anchor_right: 'Strongly

          Agree'
      codebook:
        scale_type: 7-pt Likert (agree-disagree)
        filter: Designed split sample · n=833 valid of 1,044 total
        block: HIV Stigma battery (randomized order, k=13 items)
        recode: None
        design_note: 'Battery on a designed split sample (LOI-reduction allocation): ~80% of respondents received
          these items. Sig markers compare each segment against the rest of the valid sample within this battery.'
      metric_label_scale: Top-3 Box (5-7) of 7-pt agree-disagree scale
    mfq:
      section: stigma
      total: 8
      scale: 7
      scale_anchors:
      - Not at all RELEVANT
      - Neither / Neutral
      - Extremely RELEVANT
      survey:
        style: CARDSHUFFLE
        intro: Now consider a different set of moral concerns. For each item below, please indicate how relevant
          it is to how you make moral judgments, from 1 ('Not at all relevant') to 7 ('Extremely relevant').
        stem: How relevant is this consideration to how you make moral judgments?
        anchor_left: 'Not at all

          relevant'
        anchor_center: Neutral
        anchor_right: 'Extremely

          relevant'
      codebook:
        scale_type: 7-pt relevance scale (1 = not at all, 7 = extremely)
        filter: Designed split sample · n=829 valid of 1,044 total
        block: Moral Foundations Questionnaire (randomized order, k=8 items)
        recode: None
        citation: Graham J, Haidt J, Nosek BA (2009). Liberals and conservatives rely on different sets of moral
          foundations. J Pers Soc Psychol, 96(5), 1029–46.
        design_note: 'Abbreviated MFQ on a designed split sample (LOI-reduction allocation): ~80% of respondents
          received these items. Care (r1, r2), Purity (r3, r4), Fairness (r5), Liberty (r6), Loyalty (r7), Authority
          (r8). Care/Purity items feed CFS, PFS, SCF composites.'
      metric_label_scale: Top-3 Box (5-7) of 7-pt relevance scale
  influencer_blocks:
  - id: composites
    block_label: Influencer360 — Composites
    wording: Behavioral influence composite scores (derived, not asked)
    kind: composites
    pane_style: derived_note
    pane_subtitle: L1, L2, L3, and BCS are computed from the behavioral items below. They are not survey questions;
      they summarize behavioral influence into tiers and a continuous index.
    items:
    - var: XCOMPUTE_LOWINFr1
      code: L1
      wording: L1 — Low-engagement tier
      metric: pct_yes
      formula: L1 = 1 if (LOWINFr1=1) OR (LOWINFr2=1) OR (LOWINFr3=1), else 0
    - var: XCOMPUTE_LOWINFr2
      code: L2
      wording: L2 — Medium-engagement tier
      metric: pct_yes
      formula: L2 = 1 if (INFLUENCER360r4=1) OR (r7=1) OR (r13=1), else 0
    - var: XCOMPUTE_LOWINFr3
      code: L3
      wording: L3 — High-engagement tier
      metric: pct_yes
      formula: L3 = 1 if any of INFLUENCER360r1, r2, r3, r5, r6, r8, r9, r10, r11, r12, r14 = 1
    - var: XSMr4
      code: BCS
      wording: BCS — Behavioral Coalition Score (continuous)
      metric: mean
      formula: BCS = composite influence index (0–1) derived from QSMr1-r3 + tier indicators

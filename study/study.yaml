# ── TOPLINE REGISTRIES (compute_core) ──────────────────────────────────
# Everything the topline engine needs that varies per study. Field
# semantics are documented in pipeline/topline/BUILD_GUIDE.md.
# segments are NOT here — both engines read segment_registry above.
topline_config:
  # id / title / field_dates / version / analyst inherit from the
  # top-level study block; only topline-specific display fields live here.
  study:
    subtitle: PRISM Voter Study — RCG / Dynata
    weighted: true
    weight_target: Rake weights — Census parameters (age × sex × race/ethnicity × education × region) × 2024 vote
    weight_note: Production two-stage rake weights applied (WEIGHT). Weighted n equals sample n.
    validity_note: All n=1,044 included. Validity flags pending review.
    nav_brand: PRISM
    nav_study_label: HIV Treatment & Prevention
    coalition_a_label: GOP Coalition
    coalition_b_label: DEM Coalition
    party_band_a_label: GOP COALITION
    party_band_b_label: DEM COALITION
  labels:
    pop_top3: Top-3 (5-7)
    pop_bot3: Bot-3 (1-3)
    pop_mean: Mean
    pop_n: n
    pop_net: NET
    pop_delta_top3: Δ Top-3
    pop_delta_mean: Δ Mean
    pop_n_paired: n (paired)
    pop_paired_title: Paired test (McNemar)
    pop_paired_no_discord: no discordant pairs
    pop_paired_switchers: '{gain} respondents gained top-3 · {loss} lost top-3'
    pop_dvr_title: Δ vs. rest of sample
    pop_dvr_subtitle: Differential persuadability
    method_mcnemar_chi2: McNemar (continuity corrected)
    method_mcnemar_exact: Exact McNemar (binomial)
    method_no_discord: no discordant pairs
    sig_zr_ns: not sig vs. rest of sample
    sig_zr_05: sig at p<.05 vs. rest of sample
    sig_zr_01: sig at p<.01 vs. rest of sample
    sig_d_ns: not sig
    sig_d_10: sig at p<.10
    sig_d_05: sig at p<.05
    sig_d_01: sig at p<.01
    sig_dvr_ns: n.s.
    sig_dvr_10: p<.10
    sig_dvr_05: p<.05
    sig_dvr_01: p<.01
    toggle_show_mb3: Show m / b3 under each cell
    toggle_show_dist: Show full 1–7 distribution in each cell
    toggle_info: Click any cell for popover · z-test vs. rest of sample
    legend_shading_title: 'Shading (top-3 vs. Total):'
    legend_shading_arrow: pp below ← Total → pp above
    legend_sig_zr_title: 'Sig — PRE/POST row (vs. rest):'
    legend_sig_d_title: 'Sig — Δ row (paired):'
    legend_p10: p<.10
    legend_p05: p<.05
    legend_p01: p<.01
  modules:
  - id: stigma
    active: true
    item_type: items
    nav_label: HIV Stigma
    tile_num: '01'
    tile_title: HIV Stigma
    tile_desc: HIV stigma · MFQ · knowledge · composites
    section_title: HIV Stigma
    section_meta: HIV stigma items, Moral Foundations, HIV knowledge, and composites (MBS, SDS, EDS, SCS, CFS, PFS,
      SCF, HKS)
    section_intro: 'Three batteries plus a composites block. <strong>HIV Stigma</strong>: 13 items (7-pt agree-disagree).
      <strong>MFQ</strong>: 8 items (7-pt relevance). <strong>HIV Knowledge</strong>: 11 items, % aware — item 5
      ("epidemic effectively over") is the false statement. <strong>Composites</strong>: MBS, SDS, EDS, SCS from
      HIV Stigma items; CFS, PFS, SCF from MFQ items; HKS from knowledge items (excluding K5).'
    show_legend: false
    show_toggles: false
  - id: prepost
    active: true
    item_type: pre_post
    nav_label: Pre / Post
    tile_num: '02'
    tile_title: Pre-Post Outcome Metrics
    tile_desc: 7 items × Total + 16 segments × PRE/POST/Δ
    section_title: Pre-Post Outcome Metrics
    section_meta: Movement on key health and policy items, before vs. after message exposure
    section_intro: 'Each item appears twice: <strong>PRE</strong> (before exposure), <strong>POST</strong> (after).
      Δ = POST − PRE. Cells show <strong>Top-3 Box %</strong>. Three panes per item: the question as the respondent
      saw it (Fraunces) · codebook (vars, scale, recodes, composites) · banner table.'
    show_legend: true
    show_toggles: true
  - id: roi
    active: true
    item_type: roi
    nav_label: ROI
    tile_num: '03'
    tile_title: ROI Scorecard
    tile_desc: 16-segment ROI infographic · Coalition × Persuasion × Activation × Influence
    section_title: ROI Scorecard
    section_meta: Per-segment ROI score, coalition support, persuasion, activation, and influence
    section_intro: 'Per-segment ROI rendered as a vector infographic. ROI is normalized: <strong>segment mean efROI
      ÷ total mean efROI</strong>. Values ≥ 1.0 appear in pills; below 1.0 grey without pill. Coalition Support
      = top-2 box of XCOALITION (Champions + Supporters). Persuasion = sign of XALIGN_MOVEr1. Activation = mean
      XROIr5 (mobilization probability). Influence³⁶⁰ = mean BCS (XSMr4). All computation aside from the ROI ratio
      is done in SPSS.'
    show_legend: false
    show_toggles: false
  - id: critics
    active: true
    item_type: items
    nav_label: Critics
    tile_num: '04'
    tile_title: Critics Messages
    tile_desc: 11 counter-argument items · Top-3 by segment
    section_title: Critics Messages
    section_meta: Counter-arguments and oppositional frames respondents may have encountered
    section_intro: <strong>Top-3 Box %</strong> agreeing with each oppositional statement, by segment. Sig markers
      indicate significance vs. rest of sample at p&lt;.05 (•) or p&lt;.01 (••). Higher = more receptive to the
      critique.
    show_legend: false
    show_toggles: false
  - id: maxdiff
    active: false
    nav_label: Message Testing
    tile_num: '05'
    tile_title: Message Testing
    tile_desc: 16 messages × MaxDiff utilities (tabular)
  - id: sources
    active: false
    nav_label: Trusted Sources
    tile_num: '06'
    tile_title: Trusted Sources
    tile_desc: 23 sources × split-sample blocked k=9
  - id: demos
    active: true
    item_type: demographics
    nav_label: Demographics
    tile_num: '07'
    tile_title: Demographics
    tile_desc: 11 questions · per-segment frequency distribution
    section_title: Demographics
    section_meta: Gender, age, race/ethnicity, region, RUCA, education, veteran, union, religion, income, personal
      contact
    section_intro: 'Each question renders as a multi-row block: one row per response option. Cells show <strong>%
      of segment selecting that option</strong>. Hover for n and weighted percent. Continuous QAGE mean/median shown
      in the age question popover.'
    show_legend: false
    show_toggles: false
  - id: influencer
    active: true
    item_type: influencer
    nav_label: Influencer360
    tile_num: 08
    tile_title: Influencer360
    tile_desc: 14 behaviors + 3 actions + social-media + composites
    section_title: Influencer360
    section_meta: Behavioral influence profile by segment — L1 / L2 / L3 / BCS composites
    section_intro: 'Single-row banner per item showing <strong>% Yes</strong> in each segment for binary behaviors,
      <strong>% any activity</strong> for the social-media frequency items (excludes "Never"). Items grouped into
      four sub-blocks: high-engagement (L2/L3), low-engagement (L1), social-media advocacy, and audience reach (categorical
      distribution). Composites L1 / L2 / L3 / BCS rendered at the top.'
    show_legend: false
    show_toggles: false

# ═══════════════════════════════════════════════════════════════════════
# PRISM STUDY CONFIG — PRISM_HIV_2026
# ═══════════════════════════════════════════════════════════════════════
# Single source of truth for analytical configuration of this study.
# The workbook (pipeline/messagemap/workbooks/Gilead_Persona-Tuned_Message_Variants_json.xlsx)
# is the source of truth for content: messages, tokens, persona variants.
# Engine reads this YAML + the workbook + the .sav and produces dashboard.json.
# ═══════════════════════════════════════════════════════════════════════

study:
  id: PRISM_HIV_2026
  title: "PRISM HIV Treatment & Prevention"
  short_name: HIV                         # nav badge / compact labels
  topic: "HIV Treatment & Prevention"     # title without the brand prefix
  client: Gilead
  field_dates: "Apr-Jun 2026"
  analyst: Bryan Dumont
  version: v1.0
  methodology: "MaxDiff · 16 PRISM segments"

# ── DATA SOURCES ────────────────────────────────────────────────────────
sources:
  sav_path: data/260433.sav                                       # study .sav (repo root data/)
  design_file: pipeline/messagemap/data/Gilead_Design_File.dat    # MaxDiff design
  variants_workbook: pipeline/messagemap/workbooks/Gilead_Persona-Tuned_Message_Variants_json.xlsx
  judgments_workbook: study/judgments.xlsx                        # analyst judgments (tier, ROI inputs)
  variants_sheet: "Message Variants"
  weight_var: WEIGHT                                               # the ONE weight column (prism package output); null if unweighted
  record_id_var: record

# ── PLATFORM CONVENTIONS (variable naming) ──────────────────────────────
# Patterns used by the rename step and generator. These let the engine
# produce/consume canonically-named data regardless of how the survey
# script labeled variables.
sav_conventions:
  arm_var: persona_framing                       # 1=PERSONA, 2=CORE
  segment_var: XSEG_ASSIGNED                     # 1..16, segment id
  design_version_var: design_version
  token_var_pattern: "M{msg_num:03d}_token"      # M001_token..MNNN_token
  task_best_pattern: "task{task:02d}_best"       # task01_best..task14_best
  task_worst_pattern: "task{task:02d}_worst"
  index_pre_pattern: "idx{idx_num:03d}_pre"
  index_post_pattern: "idx{idx_num:03d}_post"
  best_worst_encoding: msg_id_numeric            # task picks store 1..n_messages

# ── LEGACY .SAV RENAME MAP (for THIS study only) ────────────────────────
# Map the legacy Decipher-exported names to canonical names.
# Future studies fielded with canonical naming from the start make this empty.
legacy_rename:
  HIV_RANDOM: persona_framing
  QHIV_Version: design_version
  HIV_R1: M001_token
  HIV_R2: M002_token
  HIV_R3: M003_token
  HIV_R4: M004_token
  HIV_R5: M005_token
  HIV_R6: M006_token
  HIV_R7: M010_token       # irregular pairing in legacy script
  HIV_R8: M011_token
  HIV_R9: M012_token
  HIV_R10: M013_token
  HIV_R11: M015_token
  HIV_R12: M016_token
  QHIV_1best: task01_best
  QHIV_1worst: task01_worst
  QHIV_2best: task02_best
  QHIV_2worst: task02_worst
  QHIV_3best: task03_best
  QHIV_3worst: task03_worst
  QHIV_4best: task04_best
  QHIV_4worst: task04_worst
  QHIV_5best: task05_best
  QHIV_5worst: task05_worst
  QHIV_6best: task06_best
  QHIV_6worst: task06_worst
  QHIV_7best: task07_best
  QHIV_7worst: task07_worst
  QHIV_8best: task08_best
  QHIV_8worst: task08_worst
  QHIV_9best: task09_best
  QHIV_9worst: task09_worst
  QHIV_10best: task10_best
  QHIV_10worst: task10_worst
  QHIV_11best: task11_best
  QHIV_11worst: task11_worst
  QHIV_12best: task12_best
  QHIV_12worst: task12_worst
  QHIV_13best: task13_best
  QHIV_13worst: task13_worst
  QHIV_14best: task14_best
  QHIV_14worst: task14_worst
  XQPRE_1r1r1: idx001_pre
  XPOST_1r1r1: idx001_post
  QPRE_2: idx002_pre
  QPOST_2: idx002_post
  QPRE_3: idx003_pre
  QPOST_3: idx003_post
  QPRE_4: idx004_pre
  QPOST_4: idx004_post
  QPRE_5: idx005_pre
  QPOST_5: idx005_post
  XQPRE_6R: idx006_pre
  XPOST_6R: idx006_post
  QPRE_7r1: idx007_pre
  QPOST_7r1: idx007_post

# ── SEGMENT BINDINGS ────────────────────────────────────────────────────
# Per-study segment metadata. Platform-level definitions (codes, labels,
# party) live in the central PRISM segment registry, not here.
segments:
  # assignment variable = sav_conventions.segment_var; expected ids are
  # derived from segment_registry below. Only judgments live here.
  priority_tier_in_study:
    8:  2     # HHN
    11: 1     # UCP
    12: 1     # FJP
    13: 1     # HCP
    14: 2     # HAD
    15: 2     # HCI
    16: 1     # GHI
  data_confidence:
    ok_min_n: 100
    thin_min_n: 50

# ── PERSUASION INDEX ────────────────────────────────────────────────────
index:
  items:
    - {label: "HIV national priority",     reverse: false}
    - {label: "Community concern",         reverse: false}
    - {label: "Access concern",            reverse: false}
    - {label: "Personal relevance",        reverse: false}
    - {label: "Support expanded access",   reverse: false}
    - {label: "Oppose eligibility cuts",   reverse: false}
    - {label: "Innovation orientation",    reverse: false}
  scale: {min: 1, max: 7, type: likert_7pt}
  composite_method: mean
  alpha_soft_threshold: 0.70
  alpha_hard_threshold: 0.60
  on_hard_fail: block_build

# ── RESIDUALIZATION ─────────────────────────────────────────────────────
residualization:
  outcome_var: post_composite
  predictors: [pre_composite, XSEG_ASSIGNED]
  output_col: residual_shift
  min_n_to_fit: 50

# ── MAXDIFF DESIGN ──────────────────────────────────────────────────────
maxdiff:
  n_tasks: 14
  items_per_task: 4
  # n_messages and the per-message token map are DERIVED from the variants
  # workbook (sources.variants_workbook → outputs/prism_variants.json);
  # the design file path lives in sources.design_file. Nothing here to
  # keep in sync.

# ── PLATFORM CONSTRAINTS (study must fall within these) ─────────────────
platform_constraints:
  max_messages_per_study: 25
  max_tokens_per_message: 10
  max_personas: 17                       # 1 CORE + 16 PRISM segments
  max_tasks_per_respondent: 20
  max_items_per_task: 6

# ── ESTIMATION ──────────────────────────────────────────────────────────
estimation:
  cell_estimator: weighted_shift_signed
  outcome_centering: by_segment_mean
  shrinkage:
    method: empirical_bayes
    target: message_marginal
  bootstrap:
    n_iter: 500
    seed: 42
  ci_level: 0.95
  significance_rule: ci_excludes_zero
  thin_cell_threshold: 30
  shrink_weight_warn_below: 0.60

# ── LIFT VARIANTS (outcome toggle in dashboard) ─────────────────────────
lift_variants:
  - name: persuasion_messaging
    label: "PERSUASION MESSAGING"
    description: "How much engagement with this variant moves attitudinal alignment above baseline"
    outcome_construction:
      method: residualized_shift
      source_col: residual_shift
    color_scale: {min: -0.30, max: 0.30, neutral: 0.0}

  - name: base_messaging
    label: "BASE MESSAGING"
    description: "How much more aligned message-engagers are than their segment baseline"
    outcome_construction:
      method: centered_level
      source_col: pre_composite
      centering: by_segment_mean
    color_scale: {min: -0.30, max: 0.30, neutral: 0.0}

# ── TOPLINE METRICS ─────────────────────────────────────────────────────
topline:
  metrics_enabled: [share_of_preference, utility_score]
  bw_normalization: per_respondent_exposure
  utility_rescale: zero_centered_0_100
  sop_formula: softmax_exp_meanbw
  bootstrap_ci: true
  bootstrap_n_iter: 300

  # ── BAYESIAN TOPLINE ──────────────────────────────────────────────
  # New (R5+). Replaces the bootstrap softmax SoP and the seg-local
  # min-max Utility with Bayesian posteriors. See
  # pipeline/messagemap/src/prism_topline_bayes.py.
  bayes:
    enabled: true
    n_draws: 4000
    rng_seed: 42
    sop:
      # Flat baseline prior added to every message, plus a
      # hierarchical anchor toward the total-sample posterior mean.
      # α_m  =  prior_alpha + hierarchical_K · global_share_m
      # hierarchical_K = effective sample size of the hierarchical
      # prior (one trial of borrow per cell when set to n_messages).
      prior_alpha: 1.0
      hierarchical_K: 17
    utility:
      # Posterior shrinkage of bw_norm toward 0 (B-W zero-sum within
      # MaxDiff). σ_w and τ² are estimated from the data; the
      # 0..100 secondary scale uses these fixed end-points so cross-
      # segment comparisons are valid. Leave null to auto-fit to the
      # pooled 1st/99th percentiles of bw_norm.
      scale_min: null
      scale_max: null

# ── SIMPLE SoP PLOT ─────────────────────────────────────────────────────
sop_simple:
  enabled: true
  default_basket: priority_d

# ── BASKETS ─────────────────────────────────────────────────────────────
# Selectors resolve against segment_registry + priority_tier_in_study:
#   all        → every segment          party:GOP / party:DEM → by party
#   tier:any   → any priority tier      tier:1                → that tier
# Explicit id lists ([11, 12, ...]) remain supported for ad-hoc baskets.
baskets:
  - {id: total,        name: "Total Sample",          segments: all,        weight: equal}
  - {id: priority_d,   name: "D-side Persuadables",   segments: "tier:1",   weight: equal}
  - {id: priority_all, name: "Full Priority Basket",  segments: "tier:any", weight: equal}
  - {id: gop,          name: "GOP Segments",          segments: "party:GOP", weight: equal}
  - {id: dem,          name: "DEM Segments",          segments: "party:DEM", weight: equal}

# ── DASHBOARD ───────────────────────────────────────────────────────────
dashboard:
  default_view: message_map
  views:
    message_map:   {enabled: true,  default: true}
    topline_table: {enabled: true,  default: false}
    sop_simple:    {enabled: true,  default: false}
  default_outcome: persuasion_messaging
  outcome_toggle_visible: true
  default_basket: priority_d
  basket_selector_visible: true
  cell_render:
    show_uncertainty: always
    fade_low_confidence: true
    value_decimals: 2
  segment_display:
    context_segments: collapsed
    show_data_confidence_flag: true

  # ── ROI / PRIORITY-TIER OVERRIDES ─────────────────────────────────────
  # Final-pass overrides for roi_data fields that the workbook would
  # otherwise own (priority_tier, coalition_support, activation_prob,
  # influence_pct). Applied AFTER _apply_workbook_roi_overrides in
  # compute_core.py — so YAML wins over the workbook, the workbook
  # wins over the computed values from the .sav.
  #
  # Use this for analyst-judgment changes that haven't been folded back
  # into study/judgments.xlsx yet (the workbook is the long-term home;
  # this is the express lane).
  #
  # Composite ROI scoring (composite_roi vs composite_roi_test):
  #   active = "decipher"     → composite_roi (XROIr7-based) is the
  #                             deliverable; composite_roi_test stays
  #                             computed but unused by the UI.
  #   active = "prism_native" → composite_roi_test_lift drives tiering
  #                             and any UI ranking (next study default).
  roi:
    composite_scorer:
      active: decipher
    # Per-segment overrides. Any key you omit falls back to the workbook.
    overrides:
      TSP: { priority_tier: 1 }
      HF:  { priority_tier: 1 }
      HHN: { priority_tier: 1 }
      UCP: { priority_tier: 1 }
      FJP: { priority_tier: 1 }
      HCP: { priority_tier: 1 }
      GHI: { priority_tier: 1 }
      CEC: { priority_tier: 2 }
      MFL: { priority_tier: 2 }
      HAD: { priority_tier: 2 }
      HCI: { priority_tier: 2 }
      VS:  { priority_tier: 3 }
      PFF: { priority_tier: 3 }
      PP:  { priority_tier: 3 }
      TC:  { priority_tier: 3 }
      WE:  { priority_tier: 3 }

  # ── SEGMENT SUMMARY DRAWER ────────────────────────────────────────────
  # Editorial copy + per-segment overrides for the per-audience strategic
  # brief that opens from the Message Map (click any segment header).
  # The drawer renders NOTHING for any key that is missing — the analyst
  # owns the voice. Patched into dashboard.json by:
  #   python scripts/patch_segment_summary.py
  segment_summary:
    # Editorial-judgment thresholds. The analyst owns these — they
    # decide what counts as "lead-worthy", "avoid-worthy", and "still
    # works for base reinforcement".
    rules:
      # Min signed utility for a message to qualify as LEAD WITH.
      lead_util_min: 0.03
      # Lead requires SoP >= median(SoP); set false to disable the SoP
      # gate and pick purely on utility.
      lead_require_sop_above_median: true
      # Max signed utility for a message to qualify as AVOID (i.e. the
      # message's utility must be <= this value — typically negative).
      avoid_util_max: -0.05
      # Min base-channel lift_shrunk for the "still works for owned-
      # channel base reinforcement" note to render under AVOID. Set
      # null to disable the note entirely.
      avoid_owned_lift_min: 0.25

    # Editorial copy. Tokens: {sigma}, {base_lift} are filled at render time.
    copy:
      cards:
        lead:
          title: "LEAD WITH"
          subtitle: "Universal, non-polarizing — highest utility among broadly accepted messages"
          action_chip: "→ Utility"
          override_badge: "PINNED"
          sigma_tied_note: "Multiple themes within σ={sigma} on SoP — utility chose the winner"
        avoid:
          title: "AVOID"
          subtitle: "Backfires or polarizes — drag on persuasion outweighs upside"
          action_chip: "→ Utility"
          override_badge: "PINNED"
          owned_channel_note: "Still works for owned-channel base reinforcement (lift {base_lift})"
        persuade:
          title: "PERSUADE WITH"
          subtitle: "Top variants for moving uncommitted (best persona × proof per theme)"
          action_chip: "→ Persuasion"
          override_badge: "PINNED"
        reinforce:
          title: "REINFORCE SUPPORT"
          subtitle: "Top variants for owned-channel base activation (best persona × proof per theme)"
          action_chip: "→ Base"
          override_badge: "PINNED"
      message_box:
        empty: "No qualifying message"
        persona_arm: "PERSONA"
        core_arm: "CORE"
        no_proof_label: "no proof"
        proof_prefix: "+ proof: "
        sig_label: "sig"

    # Per-segment overrides. Pin a message into a slot by setting:
    #   <SEG_CODE>:
    #     lead: <msg_id>          # single int
    #     avoid: <msg_id>         # single int
    #     persuade: [<m>, <m>]    # list, in display order
    #     reinforce: [<m>, <m>]   # list, in display order
    # Any slot you omit auto-derives from the rules baked into the drawer
    # (lead = max signed utility among SoP-median+; avoid = min signed
    # utility ≤ −0.05; persuade/reinforce = top-3 positive-lift cells,
    # best variant per theme, AVOID message excluded).
    overrides: {}

# ── OUTPUT ──────────────────────────────────────────────────────────────
output:
  dashboard_json: outputs/dashboard.json
  cells_csv: outputs/prism_cells.csv
  exposure_csv: outputs/prism_exposure_long.csv
  variants_json: outputs/prism_variants.json

# ── SEGMENT REGISTRY ────────────────────────────────────────────────────
